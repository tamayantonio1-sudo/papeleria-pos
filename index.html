<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS - Papelería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <style>
        body { background-color: #f4f4f5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpF642MYoVTDop7iMkkrvmRZWQql7cOR6dBNwZC4mjh2F4nVF7frOBeImNaohm-DOmrg/exec";

const { useState, useEffect, useMemo } = React;

const fmt = n => `$${Number(n).toFixed(2)}`;
const genFolio = () => `F-${Date.now().toString().slice(-6)}`;

function ProductCard({ item, cartQty, onAdd, onRemove }) {
    const lowStock   = item.stock > 0 && item.stock <= item.minimo;
    const outOfStock = item.stock === 0;
    return (
        <div className={`bg-white rounded-xl border border-zinc-200 p-3 flex flex-col gap-2 select-none ${outOfStock ? 'opacity-50' : ''}`}>
            <div className="flex items-start justify-between gap-1">
                <div className="min-w-0">
                    <p className="text-xs text-zinc-400">#{item.id}</p>
                    <h3 className="font-medium text-zinc-900 text-sm leading-tight">{item.name}</h3>
                </div>
                {outOfStock && <span className="text-xs bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full shrink-0">Agotado</span>}
                {lowStock   && <span className="text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full shrink-0">Bajo</span>}
            </div>
            <div className="flex items-end justify-between mt-auto">
                <div>
                    <p className="font-bold text-zinc-950">{fmt(item.price)}</p>
                    <p className="text-xs text-zinc-400">Exist: {item.stock}</p>
                </div>
                {cartQty > 0 ? (
                    <div className="flex items-center gap-1.5">
                        <button onClick={() => onRemove(item.id)} className="w-7 h-7 rounded-full bg-zinc-100 hover:bg-zinc-200 flex items-center justify-center">
                            <i className="ph ph-minus text-sm"></i>
                        </button>
                        <span className="w-5 text-center font-bold text-sm">{cartQty}</span>
                        <button onClick={() => onAdd(item)} disabled={cartQty >= item.stock} className="w-7 h-7 rounded-full bg-zinc-900 flex items-center justify-center text-white disabled:opacity-30">
                            <i className="ph ph-plus text-sm"></i>
                        </button>
                    </div>
                ) : (
                    <button onClick={() => onAdd(item)} disabled={outOfStock} className="flex items-center gap-1 px-3 py-1.5 bg-zinc-900 text-white text-xs font-medium rounded-lg disabled:opacity-40">
                        <i className="ph ph-plus"></i> Agregar
                    </button>
                )}
            </div>
        </div>
    );
}

function CartRow({ item, qty, onAdd, onRemove }) {
    return (
        <div className="flex items-center gap-2 py-2.5 border-b border-zinc-100 last:border-0">
            <div className="flex-1 min-w-0">
                <p className="text-sm font-medium text-zinc-900 truncate">{item.name}</p>
                <p className="text-xs text-zinc-400">{fmt(item.price)} c/u</p>
            </div>
            <div className="flex items-center gap-1">
                <button onClick={() => onRemove(item.id)} className="w-6 h-6 rounded-full bg-zinc-100 hover:bg-zinc-200 flex items-center justify-center">
                    <i className="ph ph-minus text-xs"></i>
                </button>
                <span className="w-5 text-center text-sm font-semibold">{qty}</span>
                <button onClick={() => onAdd(item)} disabled={qty >= item.stock} className="w-6 h-6 rounded-full bg-zinc-900 flex items-center justify-center text-white disabled:opacity-30">
                    <i className="ph ph-plus text-xs"></i>
                </button>
            </div>
            <p className="w-14 text-right text-sm font-bold">{fmt(item.price * qty)}</p>
        </div>
    );
}

function CheckoutModal({ total, onConfirm, onCancel, isProcessing }) {
    const [method, setMethod] = useState("efectivo");
    const [cash, setCash]     = useState("");
    const cashNum = parseFloat(cash) || 0;
    const change  = cashNum - total;
    const canPay  = method === "tarjeta" || cashNum >= total;

    const quick = [...new Set([
        Math.ceil(total),
        Math.ceil(total / 10) * 10,
        Math.ceil(total / 50) * 50,
        Math.ceil(total / 100) * 100,
    ])].slice(0, 4);

    return (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'flex-end',justifyContent:'center',zIndex:50,padding:'1rem'}} className="sm:items-center">
            <div className="bg-white rounded-2xl w-full max-w-sm p-5">
                <h2 className="text-lg font-bold text-zinc-900 mb-4">Cobrar venta</h2>
                <div className="flex gap-2 mb-4">
                    {[["efectivo","Efectivo","ph-money"],["tarjeta","Tarjeta","ph-credit-card"]].map(([val, label, icon]) => (
                        <button key={val} onClick={() => setMethod(val)}
                            className={`flex-1 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-1 transition-colors ${method === val ? 'bg-zinc-900 text-white' : 'bg-zinc-100 text-zinc-600 hover:bg-zinc-200'}`}>
                            <i className={`ph ${icon}`}></i> {label}
                        </button>
                    ))}
                </div>
                <div className="bg-zinc-50 rounded-xl p-4 mb-4 flex justify-between items-center">
                    <span className="text-zinc-500">Total</span>
                    <span className="text-2xl font-bold text-zinc-950">{fmt(total)}</span>
                </div>
                {method === "efectivo" && (<>
                    <label className="text-sm text-zinc-500 mb-1 block">Con cuánto paga</label>
                    <input type="number" value={cash} onChange={e => setCash(e.target.value)} placeholder="0.00" autoFocus
                        className="w-full border border-zinc-300 rounded-lg px-3 py-2 text-lg font-semibold text-right mb-3 focus:outline-none focus:ring-2 focus:ring-zinc-900"/>
                    <div className="flex gap-2 mb-4">
                        {quick.map(a => (
                            <button key={a} onClick={() => setCash(String(a))} className="flex-1 py-1.5 bg-zinc-100 hover:bg-zinc-200 rounded-lg text-xs font-medium text-zinc-700">${a}</button>
                        ))}
                    </div>
                    {cashNum >= total && (
                        <div className="flex justify-between items-center bg-green-50 rounded-xl px-4 py-3 mb-4">
                            <span className="text-green-700 font-medium">Cambio</span>
                            <span className="text-2xl font-bold text-green-700">{fmt(change)}</span>
                        </div>
                    )}
                </>)}
                <div className="flex gap-2 mt-2">
                    <button onClick={onCancel} disabled={isProcessing} className="flex-1 py-3 border border-zinc-300 rounded-xl text-zinc-700 font-medium hover:bg-zinc-50">
                        Cancelar
                    </button>
                    <button onClick={() => onConfirm({ method, cash: cashNum, change: Math.max(0, change) })} disabled={!canPay || isProcessing}
                        className="flex-1 py-3 bg-zinc-900 rounded-xl text-white font-semibold disabled:opacity-40 flex items-center justify-center gap-2">
                        {isProcessing
                            ? <><i className="ph ph-circle-notch animate-spin"></i> Guardando…</>
                            : <><i className="ph ph-check-circle"></i> Confirmar</>}
                    </button>
                </div>
            </div>
        </div>
    );
}

function SuccessModal({ sale, onClose }) {
    return (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,padding:'1rem'}}>
            <div className="bg-white rounded-2xl w-full max-w-xs p-6 text-center">
                <div className="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i className="ph ph-check-circle text-3xl text-green-600"></i>
                </div>
                <h2 className="text-lg font-bold text-zinc-900">¡Venta registrada!</h2>
                <p className="text-sm text-zinc-400 mt-1 mb-4">Folio: {sale.folio}</p>
                <div className="bg-zinc-50 rounded-xl p-4 mb-4 text-left space-y-2 text-sm">
                    <div className="flex justify-between">
                        <span className="text-zinc-500">Total</span>
                        <span className="font-bold">{fmt(sale.total)}</span>
                    </div>
                    {sale.method === "efectivo" && (<>
                        <div className="flex justify-between">
                            <span className="text-zinc-500">Recibido</span>
                            <span className="font-bold">{fmt(sale.cash)}</span>
                        </div>
                        <div className="flex justify-between">
                            <span className="text-zinc-500">Cambio</span>
                            <span className="font-bold text-green-600">{fmt(sale.change)}</span>
                        </div>
                    </>)}
                </div>
                <button onClick={onClose} className="w-full py-3 bg-zinc-900 rounded-xl text-white font-semibold hover:bg-zinc-700">
                    Nueva venta
                </button>
            </div>
        </div>
    );
}

function App() {
    const [inventory,    setInventory]    = useState([]);
    const [isLoading,    setIsLoading]    = useState(true);
    const [error,        setError]        = useState(null);
    const [cart,         setCart]         = useState({});
    const [search,       setSearch]       = useState("");
    const [activeTab,    setActiveTab]    = useState("productos");
    const [showCheckout, setShowCheckout] = useState(false);
    const [isProcessing, setIsProcessing] = useState(false);
    const [lastSale,     setLastSale]     = useState(null);

    const fetchInventory = async () => {
        setIsLoading(true);
        setError(null);
        try {
            const res  = await fetch(SCRIPT_URL, { redirect: "follow" });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            setInventory(data.inventario || []);
        } catch (e) {
            setError(e.message);
        } finally {
            setIsLoading(false);
        }
    };

    useEffect(() => { fetchInventory(); }, []);

    const addToCart = item => setCart(prev => {
        const cur      = prev[item.id] || 0;
        const found    = inventory.find(i => i.id === item.id);
        const maxStock = found ? found.stock : 0;
        if (cur >= maxStock) return prev;
        return { ...prev, [item.id]: cur + 1 };
    });

    const removeFromCart = id => setCart(prev => {
        if ((prev[id] || 0) <= 1) { const n = {...prev}; delete n[id]; return n; }
        return { ...prev, [id]: prev[id] - 1 };
    });

    const cartItems = useMemo(() =>
        Object.entries(cart)
            .map(([id, qty]) => ({ item: inventory.find(i => String(i.id) === id), qty }))
            .filter(x => x.item),
        [cart, inventory]);

    const total     = useMemo(() => cartItems.reduce((s, {item, qty}) => s + item.price * qty, 0), [cartItems]);
    const cartCount = useMemo(() => cartItems.reduce((s, {qty}) => s + qty, 0), [cartItems]);

    const filtered = useMemo(() => {
        const q = search.toLowerCase();
        return inventory.filter(i => i.name.toLowerCase().includes(q) || String(i.id).includes(q));
    }, [inventory, search]);

    const handleConfirm = async ({ method, cash, change }) => {
        setIsProcessing(true);
        const folio = genFolio();
        const fecha = new Date().toLocaleString("es-MX");
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                redirect: "follow",
                body: JSON.stringify({
                    folio, fecha, method, total,
                    items: cartItems.map(({ item, qty }) => ({
                        id: item.id, name: item.name, qty, price: item.price
                    })),
                }),
            });
        } catch (e) { console.error("Error al guardar venta:", e); }

        setCart({});
        setShowCheckout(false);
        setActiveTab("productos");
        setLastSale({ folio, total, method, cash, change });
        setIsProcessing(false);
        fetchInventory();
    };

    return (
        <div className="h-screen flex flex-col bg-zinc-100 overflow-hidden">

            <header className="bg-white border-b border-zinc-200 px-4 py-3 flex items-center justify-between shrink-0">
                <div className="flex items-center gap-2">
                    <i className="ph ph-storefront text-xl text-zinc-900"></i>
                    <span className="font-bold text-zinc-900">Papelería POS</span>
                </div>
                <button onClick={fetchInventory} className="p-2 rounded-lg hover:bg-zinc-100 text-zinc-500" title="Actualizar inventario">
                    <i className={`ph ph-arrows-clockwise ${isLoading ? 'animate-spin' : ''}`}></i>
                </button>
            </header>

            <div className="flex flex-1 overflow-hidden">

                <div className={`flex flex-col flex-1 overflow-hidden ${activeTab === 'carrito' ? 'hidden sm:flex' : ''}`}>
                    <div className="px-3 py-2 bg-white border-b border-zinc-200 shrink-0">
                        <div className="relative">
                            <i className="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"></i>
                            <input type="text" placeholder="Buscar por nombre o ID…" value={search} onChange={e => setSearch(e.target.value)}
                                className="w-full pl-9 pr-4 py-2 bg-zinc-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900"/>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-3 no-scrollbar">
                        {isLoading ? (
                            <div className="flex flex-col items-center justify-center h-40 text-zinc-400 gap-2">
                                <i className="ph ph-circle-notch animate-spin text-2xl"></i>
                                <p className="text-sm">Cargando inventario…</p>
                            </div>
                        ) : error ? (
                            <div className="flex flex-col items-center justify-center h-40 gap-2 text-zinc-400">
                                <i className="ph ph-warning text-2xl text-amber-400"></i>
                                <p className="text-sm">Error al cargar. <button onClick={fetchInventory} className="underline text-zinc-700">Reintentar</button></p>
                            </div>
                        ) : filtered.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-40 text-zinc-400 gap-2">
                                <i className="ph ph-smiley-sad text-2xl"></i>
                                <p className="text-sm">Sin resultados para "{search}"</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
                                {filtered.map(item => (
                                    <ProductCard key={item.id} item={item} cartQty={cart[item.id] || 0} onAdd={addToCart} onRemove={removeFromCart}/>
                                ))}
                            </div>
                        )}
                    </div>
                </div>

                <div className={`w-full sm:w-80 flex flex-col bg-white border-l border-zinc-200 shrink-0 ${activeTab === 'productos' ? 'hidden sm:flex' : ''}`}>
                    <div className="px-4 py-3 border-b border-zinc-100 flex items-center justify-between shrink-0">
                        <h2 className="font-bold text-zinc-900 flex items-center gap-2">
                            <i className="ph ph-shopping-cart"></i> Carrito
                        </h2>
                        {cartCount > 0 && <span className="bg-zinc-900 text-white text-xs px-2 py-0.5 rounded-full">{cartCount}</span>}
                    </div>
                    <div className="flex-1 overflow-y-auto px-4 no-scrollbar">
                        {cartItems.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-40 text-zinc-300 gap-2">
                                <i className="ph ph-shopping-cart text-4xl"></i>
                                <p className="text-sm">Carrito vacío</p>
                            </div>
                        ) : (
                            <div className="py-2">
                                {cartItems.map(({ item, qty }) => (
                                    <CartRow key={item.id} item={item} qty={qty} onAdd={addToCart} onRemove={removeFromCart}/>
                                ))}
                            </div>
                        )}
                    </div>
                    <div className="p-4 border-t border-zinc-200 shrink-0">
                        <div className="flex justify-between items-center mb-3">
                            <span className="text-zinc-400 text-sm">{cartCount} artículo{cartCount !== 1 ? 's' : ''}</span>
                            <span className="text-xl font-bold text-zinc-950">{fmt(total)}</span>
                        </div>
                        <button onClick={() => setShowCheckout(true)} disabled={cartItems.length === 0}
                            className="w-full py-3 bg-zinc-900 hover:bg-zinc-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold rounded-xl flex items-center justify-center gap-2 transition-colors">
                            <i className="ph ph-cash-register"></i>
                            Cobrar {cartItems.length > 0 && fmt(total)}
                        </button>
                        {cartItems.length > 0 && (
                            <button onClick={() => setCart({})} className="w-full mt-2 py-2 text-sm text-zinc-400 hover:text-red-500 transition-colors">
                                Vaciar carrito
                            </button>
                        )}
                    </div>
                </div>
            </div>

            <div className="sm:hidden flex bg-white border-t border-zinc-200 shrink-0">
                {[["productos","Productos","ph-grid-four"],["carrito","Carrito","ph-shopping-cart"]].map(([tab, label, icon]) => (
                    <button key={tab} onClick={() => setActiveTab(tab)}
                        className={`flex-1 py-3 flex flex-col items-center gap-0.5 text-xs font-medium relative transition-colors ${activeTab === tab ? 'text-zinc-900' : 'text-zinc-400'}`}>
                        <i className={`ph ${icon} text-xl`}></i>
                        {label}
                        {tab === 'carrito' && cartCount > 0 && (
                            <span className="absolute top-2 right-[30%] w-4 h-4 bg-zinc-900 text-white text-xs rounded-full flex items-center justify-center">{cartCount}</span>
                        )}
                    </button>
                ))}
            </div>

            {showCheckout && (
                <CheckoutModal total={total} onConfirm={handleConfirm} onCancel={() => setShowCheckout(false)} isProcessing={isProcessing}/>
            )}
            {lastSale && (
                <SuccessModal sale={lastSale} onClose={() => setLastSale(null)}/>
            )}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
