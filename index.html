            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },

                        'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',

                    },
                    keyframes: {
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },

<body>
    <div id="root"></div>

    <script type="text/babel">
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpF642MYoVTDop7iMkkrvmRZWQql7cOR6dBNwZC4mjh2F4nVF7frOBeImNaohm-DOmrg/exec";

        const { useState, useEffect, useMemo, useRef } = React;

        // =====================================================================
        //  UTILIDADES
        // =====================================================================
        const store = {
            get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
            set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
        };
        function usePersisted(key, initial) {
            const [v, setV] = useState(() => store.get(key, initial));
            useEffect(() => { store.set(key, v); }, [key, v]);
            return [v, setV];
        }
        const money = n => { const x = Number(n || 0); return (x < -0.004 ? '-$' : '$') + Math.abs(x).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
        const sum = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
        const monthKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
        const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        const monthLabel = key => { const [y, m] = key.split('-'); return `${MESES[Number(m) - 1]} ${y}`; };
        const fmtDate = d => d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
        const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
        const daysUntil = d => Math.ceil((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(new Date().toDateString())) / 86400000);
        // Si el vencimiento cae en sábado o domingo, se recorre al siguiente día hábil (no contempla días festivos)
        const nextBusinessDay = d => { const x = new Date(d); while (x.getDay() === 0 || x.getDay() === 6) x.setDate(x.getDate() + 1); return x; };

        // =====================================================================
        //  PARÁMETROS FISCALES (referenciales; validar con contador cada año)
        // =====================================================================
        const REGIMENES = {
            '626': 'RESICO – Régimen Simplificado de Confianza (626)',
            '612': 'Actividades Empresariales y Profesionales (612)',
            'none': 'Aún no estoy inscrito en el SAT'
        };
        // RESICO persona física: tasa mensual sobre ingresos cobrados sin IVA (art. 113-E LISR)
        const RESICO_TRAMOS = [[25000, 1.00], [50000, 1.10], [83333.33, 1.50], [208333.33, 2.00], [3500000, 2.50]];
        const RESICO_LIMITE_ANUAL = 3500000;
        // Tarifa anual art. 152 LISR (vigente desde 2023): [límite inferior, cuota fija, % excedente]
        const TARIFA_ANUAL = [
            [0.01, 0, 1.92], [8952.50, 171.88, 6.40], [75984.56, 4461.94, 10.88], [133536.08, 10723.55, 16.00],
            [155229.81, 14194.54, 17.92], [185852.58, 19682.13, 21.36], [374837.89, 60049.40, 23.52],
            [590796.00, 110842.74, 30.00], [1127926.85, 271981.99, 32.00], [1503902.47, 392294.17, 34.00],
            [4511707.38, 1414947.85, 35.00]
        ];
        const resicoTasa = baseMensual => { for (const [lim, t] of RESICO_TRAMOS) if (baseMensual <= lim) return t; return 2.5; };
        // Tarifa acumulada para pagos provisionales: tarifa anual × (meses / 12)
        const isrTarifaAcumulada = (base, meses) => {
            if (base <= 0) return 0;
            const f = meses / 12;
            let row = TARIFA_ANUAL[0];
            for (const r of TARIFA_ANUAL) if (base >= r[0] * f) row = r;
            return row[1] * f + (base - row[0] * f) * row[2] / 100;
        };

        const CONFIG_DEFAULT = { regimen: '626', ivaDefault: 0.16, rfc: '', nombre: '', efirmaVence: '', periodicidadGlobal: 'mensual', comprasConFactura: false };

        // =====================================================================
        //  CHECKLIST DE FORMALIZACIÓN (persona física con papelería)
        // =====================================================================
        const CHECKLIST = [
            { grupo: 'SAT · Alta y régimen', icon: 'ph-identification-card', items: [
                { id: 'rfc', t: 'RFC con la actividad económica correcta', d: 'Tu Constancia de Situación Fiscal debe mostrar "Comercio al por menor de artículos de papelería". Si das copias, impresiones o engargolados, agrega también esa actividad de servicios.' },
                { id: 'regimen', t: 'Régimen fiscal elegido con criterio', d: 'Persona física con ingresos de hasta $3.5 M al año: RESICO (626) paga ISR de 1% a 2.5% sobre lo cobrado, sin deducciones. Actividades Empresariales (612) paga sobre utilidad y sí deduce gastos. Si tu margen es bajo y tienes muchos gastos con factura, el 612 puede convenir. Decídelo con un contador.' },
                { id: 'efirma', t: 'e.firma vigente', d: 'Se tramita en oficina del SAT con cita. Dura 4 años: registra su fecha de vencimiento en Ajustes para que la app te avise.' },
                { id: 'contrasena', t: 'Contraseña del SAT', d: 'Para entrar al portal, presentar declaraciones y facturar con la herramienta gratuita.' },
                { id: 'buzon', t: 'Buzón tributario habilitado', d: 'Obligatorio. Registra y confirma correo y celular. Si no lo habilitas, el SAT puede multarte y notificarte por estrados sin que te enteres.' },
                { id: 'domicilio', t: 'Domicilio fiscal correcto y aviso de apertura del local', d: 'Si la papelería está en un lugar distinto a tu domicilio fiscal, presenta el aviso de apertura de establecimiento.' },
                { id: 'csf', t: 'Constancia de Situación Fiscal a la mano', d: 'La piden proveedores, bancos y clientes que te solicitan factura. Descárgala actualizada.' },
            ]},
            { grupo: 'SAT · Facturación (CFDI 4.0)', icon: 'ph-receipt', items: [
                { id: 'csd', t: 'Certificado de Sello Digital (CSD)', d: 'Se genera con tu e.firma (programa Certifica del SAT). Lo necesitas para facturar con cualquier proveedor.' },
                { id: 'facturador', t: 'Herramienta para facturar', d: 'Gratuita: servicio de facturación del portal del SAT. De pago: un proveedor (PAC), más práctico para factura global, cancelaciones y facturar desde el celular.' },
                { id: 'factura_cliente', t: 'Proceso para facturar a quien lo pida', d: 'Pide RFC, nombre o razón social exactos, código postal, régimen fiscal y uso del CFDI. En esta app marca la venta como "Requiere factura" para no olvidarla.' },
                { id: 'factura_global', t: 'Factura global al público en general', d: 'Ampara las ventas sin factura individual. Periodicidad diaria, semanal, mensual o bimestral (bimestral solo RESICO persona física). Se emite dentro de las 24 h siguientes al cierre del periodo. La pestaña Resumen te calcula el monto.' },
                { id: 'cfdi_compras', t: 'Pedir factura de todas tus compras', d: 'Mercancía, renta, luz, internet, tóner, papel. Sin CFDI no puedes acreditar IVA ni deducir. Regístralas en la pestaña Gastos.' },
                { id: 'pago_no_efectivo', t: 'Pagar gastos mayores a $2,000 sin efectivo', d: 'Para que una compra sea deducible arriba de $2,000 debe pagarse con transferencia, tarjeta o cheque nominativo.' },
                { id: 'xml', t: 'Guardar los XML emitidos y recibidos (mínimo 5 años)', d: 'Descárgalos del portal o de tu PAC cada mes y respáldalos en la nube.' },
            ]},
            { grupo: 'SAT · Declaraciones', icon: 'ph-calendar-check', items: [
                { id: 'mensual', t: 'Declaración mensual de ISR e IVA', d: 'A más tardar el día 17 del mes siguiente. Si un mes no vendes, se presenta en ceros mientras tengas obligaciones activas.' },
                { id: 'anual', t: 'Declaración anual', d: 'Personas físicas: durante abril del año siguiente.' },
                { id: 'diot', t: 'Confirmar si presentas DIOT', d: 'La Declaración Informativa de Operaciones con Terceros aplica según tu régimen y las facilidades vigentes. Pregúntale a tu contador.' },
                { id: 'opinion', t: 'Opinión de cumplimiento en positivo', d: 'Revísala cada mes en el portal. Te la pedirán para créditos, apoyos o vender a empresas y gobierno.' },
                { id: 'contador', t: 'Contador o despacho de confianza', d: 'Esta app estima, no declara. Un contador revisa régimen, deducciones y presenta en tiempo.' },
            ]},
            { grupo: 'Municipio y local', icon: 'ph-storefront', items: [
                { id: 'uso_suelo', t: 'Uso de suelo compatible con comercio', d: 'Se solicita en el municipio o alcaldía antes de la licencia.' },
                { id: 'licencia', t: 'Licencia o aviso de funcionamiento', d: 'Trámite municipal. En muchos municipios la papelería es giro de bajo impacto y basta un aviso; verifica en el tuyo.' },
                { id: 'proteccion_civil', t: 'Protección Civil', d: 'Extintor vigente, botiquín, señalización de rutas de evacuación y, según el municipio, dictamen o visto bueno.' },
                { id: 'anuncio', t: 'Permiso de anuncio o letrero', d: 'Algunos municipios lo cobran por separado.' },
                { id: 'renta', t: 'Contrato de arrendamiento con factura del arrendador', d: 'Si rentas el local, exige CFDI por la renta: es gasto y su IVA se acredita.' },
                { id: 'basura', t: 'Recolección de residuos comerciales', d: 'Muchos municipios exigen contrato o pago de derechos para comercios.' },
            ]},
            { grupo: 'Si contratas personal', icon: 'ph-users-three', items: [
                { id: 'imss', t: 'Registro patronal en el IMSS', d: 'Da de alta a cada trabajador antes de que empiece a laborar.' },
                { id: 'infonavit', t: 'Aportaciones al INFONAVIT', d: 'Se pagan bimestralmente junto con las cuotas del IMSS.' },
                { id: 'isn', t: 'Impuesto Sobre Nómina (estatal)', d: 'Registro en la secretaría de finanzas de tu estado; la tasa varía por estado.' },
                { id: 'nomina', t: 'Recibos de nómina timbrados (CFDI de nómina)', d: 'Por cada pago al trabajador, con la retención de ISR que corresponda.' },
                { id: 'contrato_laboral', t: 'Contrato laboral por escrito', d: 'Protege a ambas partes ante la autoridad laboral.' },
            ]},
            { grupo: 'Clientes y operación', icon: 'ph-shield-check', items: [
                { id: 'precios', t: 'Precios visibles con IVA incluido', d: 'Lo exige la Ley Federal de Protección al Consumidor (PROFECO).' },
                { id: 'ticket', t: 'Entregar comprobante de compra', d: 'Ticket o nota a quien lo pida; si piden factura, el CFDI.' },
                { id: 'banco', t: 'Cuenta bancaria solo para el negocio', d: 'Separa tus finanzas personales; facilita conciliar ventas con tarjeta y transferencia.' },
                { id: 'terminal', t: 'Cobro con tarjeta y transferencia', d: 'Formaliza ingresos y reduce el manejo de efectivo. Registra el método de pago en cada venta.' },
                { id: 'privacidad', t: 'Aviso de privacidad', d: 'Si guardas datos de clientes (por ejemplo, para facturar), debes tener uno visible.' },
                { id: 'respaldo', t: 'Respaldo mensual de la información', d: 'Usa "Exportar respaldo" en Ajustes y guarda el archivo en la nube.' },
            ]},
            { grupo: 'Opcional / crecimiento', icon: 'ph-rocket-launch', items: [
                { id: 'marca', t: 'Registro de marca ante el IMPI', d: 'Protege el nombre y logo de la papelería.' },
                { id: 'seguro', t: 'Seguro del local y la mercancía', d: 'Robo, incendio, daños por agua: el papel es muy sensible.' },
                { id: 'siem', t: 'Registro en el SIEM', d: 'Sistema de Información Empresarial Mexicano. Es obligatorio por ley para comercios, aunque se revisa poco.' },
            ]},
        ];
        const CHECKLIST_TOTAL = CHECKLIST.reduce((s, g) => s + g.items.length, 0);

        // =====================================================================
        //  APP
        // =====================================================================
        function App() {
            const [activeTab, setActiveTab] = useState('pos');
            const [inventory, setInventory] = useState([]);
            const [missingItems, setMissingItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [notification, setNotification] = useState('');
            const [isLoading, setIsLoading] = useState(true);

            // Datos fiscales (se guardan en este dispositivo)
            const [ventas, setVentas] = usePersisted('pap_ventas_v1', []);
            const [gastos, setGastos] = usePersisted('pap_gastos_v1', []);
            const [checklist, setChecklist] = usePersisted('pap_checklist_v1', {});
            const [config, setConfig] = usePersisted('pap_config_v1', CONFIG_DEFAULT);
            const [taxRates, setTaxRates] = usePersisted('pap_tasas_v1', {});

            const cfg = { ...CONFIG_DEFAULT, ...config };
            const rateFor = id => taxRates[id] !== undefined ? taxRates[id] : cfg.ivaDefault;

            // ---------------- Sincronización con Google Sheets ----------------
            // Cola de envíos pendientes: si no hay internet o el Sheet falla, nada se pierde;
            // se reintenta al sincronizar o con la siguiente operación.
            const [cola, setCola] = usePersisted('pap_cola_v1', []);
            const colaRef = useRef(cola);
            const flushing = useRef(null);
            const lastConfigSent = useRef(null);
            const setColaSync = next => { colaRef.current = next; setCola(next); };

            const postOp = async op => {
                const r = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(op),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const data = await r.json();
                if (!data.success) throw new Error(data.error || 'Error en el Sheet');
                return data;
            };

            // Envía la cola en orden; se detiene en el primer fallo. Devuelve true si quedó vacía.
            const flush = () => {
                if (flushing.current) return flushing.current;
                const run = async () => {
                    while (colaRef.current.length) {
                        const op = colaRef.current[0];
                        try { await postOp(op); }
                        catch (e) { console.warn('Envío pendiente:', e.message); break; }
                        setColaSync(colaRef.current.filter(o => o._qid !== op._qid));
                    }
                    return colaRef.current.length === 0;
                };
                const p = run().finally(() => { if (flushing.current === p) flushing.current = null; });
                flushing.current = p;
                return p;
            };

            const enqueue = op => {
                // Para la configuración solo importa el último envío
                const base = op.accion === 'config' ? colaRef.current.filter(o => o.accion !== 'config') : colaRef.current;
                setColaSync([...base, { ...op, _qid: Date.now() + Math.random() }]);
                return flush();
            };

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                setIsLoading(true);
                const sinPendientes = await flush();
                try {
                    const response = await fetch(SCRIPT_URL);
                    const data = await response.json();
                    if (data.success === false) throw new Error(data.error);
                    if (data.inventario && data.inventario.length > 0) {
                        setInventory(data.inventario.map(i => ({
                            ...i,
                            unitCost: i.unitCost ?? i.costo, margin: i.margin ?? i.margen, minStock: i.minStock ?? i.minimo
                        })));
                    } else { showNotification("Base de datos vacía."); setInventory([]); }
                    if (data.missingItems) setMissingItems(data.missingItems);
                    if (data.historialImportado > 0) showNotification(`${data.historialImportado} ventas del Historial agregadas al control fiscal`);

                    // El Sheet manda, salvo que haya envíos pendientes (para no perder lo local)
                    if (data.fiscal && sinPendientes) {
                        const f = data.fiscal;
                        setVentas(Array.isArray(f.ventas) ? f.ventas : []);
                        setGastos(Array.isArray(f.gastos) ? f.gastos : []);
                        const c = f.config || {};
                        if (c.config || c.checklist || c.taxRates) {
                            if (c.config) setConfig(c.config);
                            if (c.checklist) setChecklist(c.checklist);
                            if (c.taxRates) setTaxRates(c.taxRates);
                            lastConfigSent.current = JSON.stringify({ config: c.config || config, checklist: c.checklist || checklist, taxRates: c.taxRates || taxRates });
                        } else {
                            // Primera conexión: sube lo que ya tenías en este dispositivo
                            lastConfigSent.current = JSON.stringify({ config, checklist, taxRates });
                            enqueue({ accion: 'config', config, checklist, taxRates });
                            if (ventas.length || gastos.length) enqueue({ accion: 'importar', ventas, gastos });
                        }
                    } else if (data.fiscal && !sinPendientes) {
                        showNotification(`${colaRef.current.length} envío(s) pendientes`);
                    }
                } catch (error) {
                    showNotification("Error de sincronización.");
                }
                setIsLoading(false);
            };

            // Sube régimen, checklist y tasas de IVA cuando cambian (con pausa de 1.5 s)
            useEffect(() => {
                if (lastConfigSent.current === null) return; // aún no se ha leído el Sheet
                const payload = JSON.stringify({ config, checklist, taxRates });
                if (payload === lastConfigSent.current) return;
                const t = setTimeout(() => {
                    lastConfigSent.current = payload;
                    enqueue({ accion: 'config', config, checklist, taxRates });
                }, 1500);
                return () => clearTimeout(t);
            }, [config, checklist, taxRates]);

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3000);
            };

            const addToCart = (product) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    if (existing.quantity >= product.stock) { showNotification('Stock insuficiente'); return; }
                    setCart(cart.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item));
                } else {
                    if (product.stock <= 0) { showNotification('Agotado'); return; }
                    setCart([...cart, { ...product, quantity: 1 }]);
                }
            };

            const checkout = async ({ metodoPago, requiereFactura, id }) => {
                if (cart.length === 0) return;
                const items = cart.map(i => {
                    const rate = rateFor(i.id);
                    const subtotal = Number(i.price) * i.quantity;
                    const base = subtotal / (1 + rate);
                    return { ...i, ivaRate: rate, subtotal, base, iva: subtotal - base };
                });
                const total = sum(items, i => i.subtotal);
                const base = sum(items, i => i.base);
                const now = id || Date.now();
                const nuevaVenta = {
                    id: now, ts: now, date: new Date(now).toLocaleString(),
                    items: items.map(i => ({ id: i.id, name: i.name, quantity: i.quantity, price: Number(i.price), ivaRate: i.ivaRate })),
                    total: +total.toFixed(2),
                    metodoPago, requiereFactura, base: +base.toFixed(2), iva: +(total - base).toFixed(2)
                };

                // Registro fiscal local (compacto, sin detalle de artículos)
                setVentas(prev => [{
                    id: now, ts: now, total: +total.toFixed(2), base: nuevaVenta.base, iva: nuevaVenta.iva,
                    metodoPago, requiereFactura, facturada: false, piezas: sum(items, i => i.quantity)
                }, ...prev]);

                setInventory(inventory.map(product => {
                    const cartItem = cart.find(item => item.id === product.id);
                    return cartItem ? { ...product, stock: product.stock - cartItem.quantity } : product;
                }));
                setCart([]);
                showNotification('Procesando pago...');

                const ok = await enqueue({ accion: "venta", venta: nuevaVenta });
                if (ok) showNotification(requiereFactura ? 'Venta registrada · pendiente de facturar' : 'Venta registrada con éxito');
                else showNotification('Sin conexión: la venta se enviará al sincronizar');
            };

            const [newMissing, setNewMissing] = useState('');
            const handleAddMissing = async (e) => {
                e.preventDefault();
                if (!newMissing.trim()) return;
                const query = newMissing.trim();
                setNewMissing('');
                setMissingItems(prev => {
                    const ex = prev.find(m => String(m.name).toLowerCase() === query.toLowerCase());
                    return ex ? prev.map(m => m === ex ? { ...m, count: (m.count || 1) + 1 } : m) : [...prev, { id: Date.now(), name: query, count: 1 }];
                });
                const ok = await enqueue({ accion: "faltante", faltante: { id: Date.now(), name: query } });
                showNotification(ok ? 'Añadido a lista de deseos' : 'Sin conexión: se enviará al sincronizar');
            };

            // Operaciones fiscales: actualizan la pantalla al instante y se envían al Sheet
            const sync = {
                agregarGasto: g => { setGastos(prev => [g, ...prev]); enqueue({ accion: 'gasto', gasto: g }); },
                borrarGasto: id => { setGastos(prev => prev.filter(g => g.id !== id)); enqueue({ accion: 'borrar_gasto', id }); },
                marcarFacturada: id => { setVentas(prev => prev.map(v => v.id === id ? { ...v, facturada: true } : v)); enqueue({ accion: 'marcar_facturada', id }); },
                importar: (ventasImp, gastosImp) => enqueue({ accion: 'importar', ventas: ventasImp, gastos: gastosImp }),
            };

            const pendientesFactura = ventas.filter(v => v.requiereFactura && !v.facturada).length;

            return (
                <div className="h-screen flex flex-col md:flex-row overflow-hidden bg-zinc-50">
                    <nav className="hidden md:flex bg-zinc-950 text-zinc-400 w-64 flex-shrink-0 flex-col z-20 border-r border-zinc-800">
                        <div className="p-8 text-xl font-semibold text-white tracking-tight flex items-center gap-3">
                            <div className="w-8 h-8 bg-white text-zinc-950 rounded-lg flex items-center justify-center">
                                <i className="ph-bold ph-cube text-xl"></i>
                            </div>
                            Papelería
                        </div>
                        <div className="flex flex-col px-4 gap-1">
                            <NavButtonDesktop active={activeTab === 'pos'} onClick={() => setActiveTab('pos')} icon="ph-shopping-bag" text="Ventas" />
                            <NavButtonDesktop active={activeTab === 'inventory'} onClick={() => setActiveTab('inventory')} icon="ph-database" text="Inventario" />
                            <NavButtonDesktop active={activeTab === 'missing'} onClick={() => setActiveTab('missing')} icon="ph-bookmark-simple" text="Deseos" />
                            <NavButtonDesktop active={activeTab === 'fiscal'} onClick={() => setActiveTab('fiscal')} icon="ph-bank" text="Fiscal" badge={pendientesFactura} />
                        </div>
                        <div className="mt-auto p-4 mb-4">
                            <button onClick={fetchData} className="w-full flex items-center justify-center gap-2 p-3 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-900 transition-all duration-200">
                                <i className="ph ph-arrows-clockwise text-lg"></i> Sincronizar
                                {cola.length > 0 && <span className="bg-amber-400 text-zinc-950 text-[10px] font-bold rounded-full px-1.5">{cola.length}</span>}
                            </button>
                            <div className={`text-[11px] text-center mt-1 ${cola.length ? 'text-amber-400' : 'text-zinc-600'}`}>
                                {cola.length ? `${cola.length} envío(s) pendientes` : 'Todo guardado en el Sheet'}
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 relative flex flex-col h-full overflow-hidden">
                        {notification && (
                            <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-3 animate-pop-in z-[60] text-sm font-medium border border-zinc-800 whitespace-nowrap">
                                <i className="ph-fill ph-check-circle text-emerald-400 text-lg"></i>
                                {notification}
                            </div>
                        )}

                        {isLoading && activeTab !== 'fiscal' ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-zinc-400 animate-fade-in-up">
                                <i className="ph-light ph-circle-notch animate-spin text-4xl mb-3 text-zinc-300"></i>
                                <p className="text-sm font-medium tracking-wide">Sincronizando...</p>
                            </div>
                        ) : (
                            <div className="flex-1 overflow-y-auto pb-24 md:pb-0 p-4 md:p-8 no-scrollbar w-full max-w-7xl mx-auto">
                                {activeTab === 'pos' && <div className="animate-fade-in-up h-full"><POSView inventory={inventory} cart={cart} addToCart={addToCart} setCart={setCart} checkout={checkout} config={cfg} /></div>}
                                {activeTab === 'inventory' && <div className="animate-fade-in-up h-full"><InventoryView inventory={inventory} rateFor={rateFor} setTaxRates={setTaxRates} config={cfg} setConfig={setConfig} ventas={ventas} gastos={gastos} /></div>}
                                {activeTab === 'missing' && <div className="animate-fade-in-up h-full"><MissingView missingItems={missingItems} newMissing={newMissing} setNewMissing={setNewMissing} handleAddMissing={handleAddMissing} /></div>}
                                {activeTab === 'fiscal' && <div className="animate-fade-in-up"><FiscalView ventas={ventas} setVentas={setVentas} gastos={gastos} setGastos={setGastos} checklist={checklist} setChecklist={setChecklist} config={cfg} setConfig={setConfig} taxRates={taxRates} setTaxRates={setTaxRates} notify={showNotification} sync={sync} /></div>}
                            </div>
                        )}
                    </main>

                    <nav className="md:hidden fixed bottom-0 left-0 right-0 glass-nav border-t border-zinc-200/50 flex justify-around items-center pb-safe pt-2 px-2 z-40">
                        <NavButtonMobile active={activeTab === 'pos'} onClick={() => setActiveTab('pos')} icon="ph-shopping-bag" text="Ventas" />
                        <NavButtonMobile active={activeTab === 'inventory'} onClick={() => setActiveTab('inventory')} icon="ph-database" text="Stock" />
                        <NavButtonMobile active={activeTab === 'missing'} onClick={() => setActiveTab('missing')} icon="ph-bookmark-simple" text="Deseos" />
                        <NavButtonMobile active={activeTab === 'fiscal'} onClick={() => setActiveTab('fiscal')} icon="ph-bank" text="Fiscal" badge={pendientesFactura} />
                        <NavButtonMobile active={false} onClick={fetchData} icon="ph-arrows-clockwise" text="Sinc." badge={cola.length} />
                    </nav>
                </div>
            );
        }

        // --- NAVEGACIÓN ---
        const Badge = ({ n }) => n > 0 ? <span className="ml-auto bg-amber-400 text-zinc-950 text-[10px] font-bold rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center">{n}</span> : null;

        const NavButtonDesktop = ({ active, onClick, icon, text, badge }) => (
            <button onClick={onClick} className={`flex items-center gap-3 p-3 rounded-xl transition-all duration-300 font-medium text-sm ${active ? 'bg-zinc-800 text-white shadow-sm' : 'hover:bg-zinc-900 hover:text-zinc-200'}`}>
                <i className={`ph${active ? '-fill' : ''} ${icon} text-xl`}></i> {text} <Badge n={badge} />
            </button>
        );

        const NavButtonMobile = ({ active, onClick, icon, text, badge }) => (
            <button onClick={onClick} className={`relative flex flex-col items-center justify-center w-full p-2 mb-1 transition-all duration-300 ${active ? 'text-zinc-950' : 'text-zinc-400'}`}>
                <div className={`p-1.5 rounded-full transition-all duration-300 ${active ? 'bg-zinc-100' : ''}`}>
                    <i className={`ph${active ? '-fill' : ''} ${icon} text-2xl`}></i>
                </div>
                {badge > 0 && <span className="absolute top-1 right-1/4 bg-amber-400 text-zinc-950 text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">{badge}</span>}
                <span className={`text-[10px] mt-0.5 ${active ? 'font-semibold' : 'font-medium'}`}>{text}</span>
            </button>
        );

        // =====================================================================
        //  VENTAS (POS)
        // =====================================================================
        const METODOS = [
            { id: 'efectivo', label: 'Efectivo', icon: 'ph-money' },
            { id: 'tarjeta', label: 'Tarjeta', icon: 'ph-credit-card' },
            { id: 'transferencia', label: 'Transfer.', icon: 'ph-bank' },
        ];

        // ---------- NOTA DE COMPRA POR WHATSAPP ----------
        const folioCorto = id => 'F-' + String(id).slice(-6);
        const METODO_LABEL = { efectivo: 'Efectivo', tarjeta: 'Tarjeta', transferencia: 'Transferencia' };

        function textoNota(t, config) {
            const negocio = (config.nombreNegocio || 'Papelería').trim();
            const lineas = [
                `*${negocio}*`,
                config.direccionNegocio ? config.direccionNegocio.trim() : null,
                '',
                `🧾 *Nota de compra* · Folio ${folioCorto(t.id)}`,
                `📅 ${new Date(t.id).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' })}`,
                '',
                ...t.items.map(i => `• ${i.quantity} x ${i.name} — ${money(i.quantity * i.price)}`),
                '',
                `*Total: ${money(t.total)}*`,
                `Pago: ${METODO_LABEL[t.metodo] || t.metodo}`,
                t.metodo === 'efectivo' ? `Recibido: ${money(t.recibido)} · Cambio: ${money(t.cambio)}` : null,
                t.requiereFactura ? '\nSu factura se enviará por separado.' : null,
                '',
                config.mensajeNota ? config.mensajeNota.trim() : '¡Gracias por su compra! 😊'
            ];
            return lineas.filter(l => l !== null).join('\n');
        }

        function urlWhatsApp(telefono, texto) {
            let tel = String(telefono || '').replace(/\D/g, '');
            if (tel.length === 10) tel = '52' + tel; // número de México a 10 dígitos
            return `https://wa.me/${tel}?text=${encodeURIComponent(texto)}`;
        }

        // ---------- TICKET COMO IMAGEN / PDF ----------
        // Dibuja el ticket en un canvas. Primero mide (draw=false) para saber la altura y luego dibuja.
        function dibujarTicket(ctx, t, config, draw) {
            const W = 420, P = 28, R = W - P;
            let y = P;
            const font = (peso, tam) => { ctx.font = `${peso} ${tam}px Inter, Arial, sans-serif`; };
            const texto = (s, x, align = 'left', color = '#18181b') => { if (draw) { ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y); } };
            const envolver = (s, ancho) => {
                const palabras = String(s).split(' '), lineas = [];
                let linea = '';
                palabras.forEach(p => {
                    const prueba = linea ? linea + ' ' + p : p;
                    if (ctx.measureText(prueba).width > ancho && linea) { lineas.push(linea); linea = p; } else linea = prueba;
                });
                if (linea) lineas.push(linea);
                return lineas;
            };
            const separador = () => {
                y += 10;
                if (draw) { ctx.strokeStyle = '#d4d4d8'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(R, y); ctx.stroke(); ctx.setLineDash([]); }
                y += 22;
            };

            if (draw) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, ctx.canvas.height); ctx.textBaseline = 'alphabetic'; }

            y += 14;
            font(700, 22); envolver((config.nombreNegocio || 'Papelería').trim(), W - 2 * P).forEach(l => { texto(l, W / 2, 'center'); y += 28; });
            if (config.direccionNegocio) { font(400, 12); envolver(config.direccionNegocio.trim(), W - 2 * P).forEach(l => { texto(l, W / 2, 'center', '#71717a'); y += 17; }); }
            separador();

            font(600, 14); texto('NOTA DE COMPRA', P); font(600, 14); texto(folioCorto(t.id), R, 'right'); y += 20;
            font(400, 12); texto(new Date(t.id).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }), P, 'left', '#71717a'); y += 4;
            separador();

            t.items.forEach(i => {
                font(500, 13);
                const lineas = envolver(`${i.quantity} x ${i.name}`, W - 2 * P - 90);
                lineas.forEach((l, k) => {
                    texto(l, P);
                    if (k === 0) texto(money(i.quantity * i.price), R, 'right');
                    y += 18;
                });
                font(400, 11); texto(`${money(i.price)} c/u`, P, 'left', '#a1a1aa'); y += 20;
            });
            separador();

            font(700, 20); texto('TOTAL', P); texto(money(t.total), R, 'right'); y += 26;
            font(400, 13);
            texto('Pago', P, 'left', '#71717a'); texto(METODO_LABEL[t.metodo] || t.metodo, R, 'right'); y += 19;
            if (t.metodo === 'efectivo') {
                texto('Recibido', P, 'left', '#71717a'); texto(money(t.recibido), R, 'right'); y += 19;
                texto('Cambio', P, 'left', '#71717a'); texto(money(t.cambio), R, 'right'); y += 19;
            }
            if (t.requiereFactura) { y += 4; font(500, 12); texto('Su factura se enviará por separado.', P, 'left', '#b45309'); y += 18; }
            separador();

            font(500, 13);
            envolver(config.mensajeNota ? config.mensajeNota.trim() : '¡Gracias por su compra!', W - 2 * P).forEach(l => { texto(l, W / 2, 'center'); y += 18; });
            y += 4; font(400, 10); texto('Este documento no es un comprobante fiscal.', W / 2, 'center', '#a1a1aa'); y += P;
            return { W, H: Math.ceil(y) };
        }

        async function crearTicketCanvas(t, config) {
            try { await document.fonts.ready; } catch {}
            const escala = 2;
            const medir = document.createElement('canvas').getContext('2d');
            const { W, H } = dibujarTicket(medir, t, config, false);
            const canvas = document.createElement('canvas');
            canvas.width = W * escala; canvas.height = H * escala;
            const ctx = canvas.getContext('2d');
            ctx.scale(escala, escala);
            dibujarTicket(ctx, t, config, true);
            return { canvas, W, H };
        }

        const descargar = (blob, nombre) => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        };

        function VentaExitosaModal({ ticket, config, onClose }) {
            const [tel, setTel] = useState('');
            const [archivos, setArchivos] = useState(null); // { png: File, pdf: File, preview: url }
            const [aviso, setAviso] = useState('');
            const digitos = tel.replace(/\D/g, '');
            const telValido = digitos.length === 0 || digitos.length === 10 || digitos.length === 12;
            const enviar = () => window.open(urlWhatsApp(digitos, textoNota(ticket, config)), '_blank', 'noopener');
            const nombreBase = `nota-${folioCorto(ticket.id)}`;

            // Genera imagen y PDF al abrir, para que "Compartir" responda al instante
            useEffect(() => {
                let url = null, vivo = true;
                (async () => {
                    const { canvas, W, H } = await crearTicketCanvas(ticket, config);
                    const pngBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                    let pdf = null;
                    if (window.jspdf) {
                        const doc = new window.jspdf.jsPDF({ unit: 'pt', format: [W, H], orientation: W > H ? 'l' : 'p' });
                        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, W, H);
                        pdf = new File([doc.output('blob')], `${nombreBase}.pdf`, { type: 'application/pdf' });
                    }
                    url = URL.createObjectURL(pngBlob);
                    if (vivo) setArchivos({ png: new File([pngBlob], `${nombreBase}.png`, { type: 'image/png' }), pdf, preview: url });
                })();
                return () => { vivo = false; if (url) URL.revokeObjectURL(url); };
            }, [ticket]);

            const compartir = async archivo => {
                if (!archivo) return;
                const datos = { files: [archivo], title: `Nota de compra ${folioCorto(ticket.id)}` };
                if (navigator.canShare && navigator.canShare(datos)) {
                    try { await navigator.share(datos); return; }
                    catch (e) { if (e.name === 'AbortError') return; }
                }
                descargar(archivo, archivo.name);
                setAviso(`Se descargó ${archivo.name}. Adjúntalo en WhatsApp con el clip 📎.`);
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-zinc-950/40 backdrop-blur-sm animate-fade-in-up">
                    <div className="bg-white rounded-3xl p-6 md:p-7 w-full max-w-sm shadow-2xl animate-pop-in max-h-[92vh] overflow-y-auto no-scrollbar">
                        <div className="text-center mb-5">
                            <div className="w-14 h-14 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-3">
                                <i className="ph-fill ph-check-circle text-3xl text-emerald-500"></i>
                            </div>
                            <h3 className="text-xl font-bold text-zinc-950 tracking-tight">¡Venta registrada!</h3>
                            <p className="text-sm text-zinc-400 mt-1">Folio {folioCorto(ticket.id)}</p>
                        </div>

                        {ticket.metodo === 'efectivo' && (
                            <div className="flex justify-between items-center bg-emerald-50 border border-emerald-100 rounded-2xl px-4 py-3 mb-4">
                                <span className="text-sm font-medium text-emerald-800">Cambio a dar</span>
                                <span className="text-2xl font-bold text-emerald-600 tracking-tight">{money(ticket.cambio)}</span>
                            </div>
                        )}

                        <div className="bg-zinc-100 rounded-2xl p-3 mb-4 flex justify-center max-h-64 overflow-y-auto no-scrollbar">
                            {archivos
                                ? <img src={archivos.preview} alt="Vista previa del ticket" className="w-full max-w-[260px] h-auto rounded-lg shadow-sm" />
                                : <div className="py-10 text-xs text-zinc-400 flex items-center gap-2"><i className="ph ph-circle-notch animate-spin"></i>Generando ticket…</div>}
                        </div>

                        <div className="grid grid-cols-2 gap-2 mb-2">
                            <button onClick={() => compartir(archivos?.png)} disabled={!archivos}
                                className="py-3 rounded-xl font-semibold text-sm bg-emerald-500 text-white hover:bg-emerald-600 active:scale-95 transition-all flex items-center justify-center gap-1.5 disabled:opacity-40">
                                <i className="ph-fill ph-image text-base"></i> Imagen
                            </button>
                            <button onClick={() => compartir(archivos?.pdf)} disabled={!archivos?.pdf}
                                className="py-3 rounded-xl font-semibold text-sm bg-white border border-zinc-200 text-zinc-800 hover:bg-zinc-50 active:scale-95 transition-all flex items-center justify-center gap-1.5 disabled:opacity-40">
                                <i className="ph-fill ph-file-pdf text-base text-red-500"></i> PDF
                            </button>
                        </div>
                        <p className="text-[11px] text-zinc-400 mb-4">{aviso || 'En el celular se abre el menú para compartir: elige WhatsApp y el contacto. En la computadora se descarga el archivo.'}</p>

                        <div className="border-t border-zinc-100 pt-4 mb-1 text-xs font-semibold text-zinc-500">O enviarla como texto</div>
                        <label className="sr-only">WhatsApp del cliente (opcional)</label>
                        <div className="relative mt-1.5 mb-1">
                            <i className="ph ph-whatsapp-logo absolute left-3 top-1/2 -translate-y-1/2 text-emerald-500 text-lg"></i>
                            <input type="tel" inputMode="numeric" placeholder="10 dígitos, ej. 5512345678" value={tel} onChange={e => setTel(e.target.value)}
                                className={`w-full pl-10 pr-3 py-3 bg-white border rounded-xl outline-none text-sm transition-all ${telValido ? 'border-zinc-200 focus:border-zinc-950' : 'border-red-300'}`} />
                        </div>
                        <p className="text-[11px] text-zinc-400 mb-4">{telValido ? 'Si lo dejas vacío, WhatsApp te deja elegir el contacto.' : 'Escribe 10 dígitos (o 12 con lada de país).'}</p>

                        <div className="flex flex-col gap-2">
                            <button onClick={enviar} disabled={!telValido}
                                className="w-full py-3 rounded-xl font-semibold text-sm bg-white border border-emerald-200 text-emerald-700 hover:bg-emerald-50 active:scale-95 transition-all flex items-center justify-center gap-2 disabled:opacity-40">
                                <i className="ph-fill ph-whatsapp-logo text-lg"></i> Enviar texto por WhatsApp
                            </button>
                            <button onClick={onClose} className="w-full py-3.5 rounded-xl font-semibold text-sm bg-zinc-950 text-white hover:bg-zinc-800 transition-all">
                                Nueva venta
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function POSView({ inventory, cart, addToCart, setCart, checkout, config }) {
            const [search, setSearch] = useState('');
            const [ultimaVenta, setUltimaVenta] = useState(null);
            const [showMobileCart, setShowMobileCart] = useState(false);
            const [amountPaid, setAmountPaid] = useState('');
            const [showConfirm, setShowConfirm] = useState(false);
            const [metodo, setMetodo] = useState('efectivo');
            const [requiereFactura, setRequiereFactura] = useState(false);

            useEffect(() => {
                if (cart.length === 0) { setAmountPaid(''); setRequiereFactura(false); setMetodo('efectivo'); }
            }, [cart.length]);

            const total = cart.reduce((s, item) => s + (item.price * item.quantity), 0);
            const totalItems = cart.reduce((s, item) => s + item.quantity, 0);
            const esEfectivo = metodo === 'efectivo';
            const change = (parseFloat(amountPaid) || 0) - total;
            const isPaymentValid = cart.length > 0 && (!esEfectivo || (amountPaid !== '' && parseFloat(amountPaid) >= total - 0.001));

            const safeInventory = Array.isArray(inventory) ? inventory : [];
            const filtered = safeInventory.filter(i => i.name && i.name.toLowerCase().includes(search.toLowerCase()));

            const confirmCheckout = () => {
                const id = Date.now();
                const recibido = esEfectivo ? parseFloat(amountPaid) || total : total;
                setUltimaVenta({
                    id, metodo, requiereFactura, total, recibido, cambio: Math.max(0, recibido - total),
                    items: cart.map(i => ({ id: i.id, name: i.name, quantity: i.quantity, price: Number(i.price) }))
                });
                setShowConfirm(false);
                setAmountPaid('');
                checkout({ metodoPago: metodo, requiereFactura, id });
                setShowMobileCart(false);
            };

            const updateQty = (id, delta) => {
                setCart(cart.flatMap(i => {
                    if (i.id !== id) return [i];
                    const q = i.quantity + delta;
                    if (q <= 0) return [];
                    if (q > i.stock) return [i];
                    return [{ ...i, quantity: q }];
                }));
            };

            return (
                <div className="h-full flex flex-col lg:flex-row gap-6 lg:gap-8 relative">
                    {ultimaVenta && <VentaExitosaModal ticket={ultimaVenta} config={config} onClose={() => setUltimaVenta(null)} />}
                    {showConfirm && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-zinc-950/40 backdrop-blur-sm animate-fade-in-up">
                            <div className="bg-white rounded-3xl p-6 md:p-8 w-full max-w-sm shadow-2xl animate-pop-in">
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-zinc-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <i className="ph-fill ph-receipt text-3xl text-zinc-900"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-zinc-950 tracking-tight">Confirmar Pago</h3>
                                    <p className="text-sm text-zinc-500 mt-1">{esEfectivo ? 'Verifica el cambio antes de procesar.' : 'Verifica que el cobro se haya aprobado.'}</p>
                                </div>
                                <div className="bg-zinc-50 rounded-2xl p-4 mb-6 border border-zinc-100 space-y-3">
                                    <div className="flex justify-between text-sm"><span className="text-zinc-500">Total a cobrar:</span><span className="font-semibold text-zinc-900">{money(total)}</span></div>
                                    <div className="flex justify-between text-sm"><span className="text-zinc-500">Método:</span><span className="font-semibold text-zinc-900 capitalize">{metodo}</span></div>
                                    {requiereFactura && <div className="flex justify-between text-sm"><span className="text-zinc-500">Factura:</span><span className="font-semibold text-amber-600">Pendiente de emitir</span></div>}
                                    {esEfectivo && <>
                                        <div className="flex justify-between text-sm"><span className="text-zinc-500">Efectivo recibido:</span><span className="font-semibold text-zinc-900">{money(parseFloat(amountPaid))}</span></div>
                                        <div className="pt-3 border-t border-zinc-200 flex justify-between items-center">
                                            <span className="font-medium text-zinc-900">Cambio a dar:</span>
                                            <span className="text-2xl font-bold text-emerald-500 tracking-tight">{money(change)}</span>
                                        </div>
                                    </>}
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirm(false)} className="flex-1 py-3.5 rounded-xl font-semibold text-sm bg-white border border-zinc-200 text-zinc-700 hover:bg-zinc-50 transition-colors">Cancelar</button>
                                    <button onClick={confirmCheckout} className="flex-1 py-3.5 rounded-xl font-semibold text-sm bg-zinc-950 text-white hover:bg-zinc-800 transition-all active:scale-95 shadow-md">Confirmar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CATÁLOGO */}

                                <span className="flex items-center gap-2"><div className="bg-white/20 px-2.5 py-1 rounded-lg text-sm">{totalItems}</div>Ver Ticket</span>
                                <span className="text-lg">{money(total)}</span>
                            </button>
                        </div>
                    )}

                    {/* TICKET */}
                    <div className={`${showMobileCart ? 'fixed inset-0 z-50 bg-white flex flex-col animate-slide-up' : 'hidden'} lg:flex lg:relative lg:w-96 lg:bg-white lg:rounded-3xl lg:shadow-[0_8px_30px_rgba(0,0,0,0.04)] lg:border lg:border-zinc-200 lg:flex-col lg:h-[calc(100vh-4rem)] overflow-hidden`}>
                        <div className="flex justify-between items-center p-6 border-b border-zinc-100">
                            <h2 className="text-lg font-bold text-zinc-950 tracking-tight">Venta Actual</h2>
                            <button onClick={() => setShowMobileCart(false)} className="lg:hidden p-2 bg-zinc-100 rounded-full text-zinc-600 hover:bg-zinc-200 transition-colors"><i className="ph ph-x text-lg"></i></button>
                            <span className="hidden lg:flex bg-zinc-100 text-zinc-600 px-3 py-1 rounded-full text-xs font-bold">{totalItems} items</span>
                        </div>

                        <div className="flex-1 overflow-y-auto flex flex-col px-4 py-2 no-scrollbar">
                            {cart.length === 0 ? (
                                <div className="flex flex-col items-center justify-center h-full text-zinc-300 gap-3">
                                    <i className="ph-light ph-shopping-bag text-5xl"></i>
                                    <p className="text-sm font-medium">El ticket está vacío</p>
                                </div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} className="flex justify-between items-center py-3 border-b border-zinc-50 animate-pop-in gap-2">
                                        <div className="flex-1 min-w-0">
                                            <div className="font-medium text-zinc-900 text-sm truncate">{item.name}</div>
                                            <div className="flex items-center gap-1 mt-1">
                                                <button onClick={() => updateQty(item.id, -1)} className="w-6 h-6 rounded-md bg-zinc-100 text-zinc-600 hover:bg-zinc-200"><i className="ph ph-minus text-xs"></i></button>
                                                <span className="text-xs text-zinc-500 w-14 text-center">{item.quantity} × {money(item.price)}</span>
                                                <button onClick={() => updateQty(item.id, 1)} className="w-6 h-6 rounded-md bg-zinc-100 text-zinc-600 hover:bg-zinc-200"><i className="ph ph-plus text-xs"></i></button>
                                            </div>
                                        </div>
                                        <div className="font-semibold text-zinc-950 text-sm">{money(item.quantity * item.price)}</div>
                                        <button onClick={() => setCart(cart.filter(i => i.id !== item.id))} className="text-zinc-300 hover:text-red-500 p-1.5 transition-colors"><i className="ph-fill ph-x-circle text-xl"></i></button>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="p-5 lg:p-6 bg-zinc-50/50 border-t border-zinc-100 mt-auto">
                            <div className="flex justify-between items-end mb-4">
                                <span className="text-zinc-500 font-medium text-sm mb-1">Total a cobrar</span>
                                <span className="text-3xl font-bold text-zinc-950 tracking-tight">{money(total)}</span>
                            </div>

                            {cart.length > 0 && (
                                <div className="space-y-3 mb-5 animate-fade-in-up">
                                    <div className="grid grid-cols-3 gap-1.5 bg-zinc-100 p-1 rounded-xl">
                                        {METODOS.map(m => (
                                            <button key={m.id} onClick={() => setMetodo(m.id)}
                                                className={`py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1 transition-all ${metodo === m.id ? 'bg-white text-zinc-950 shadow-sm' : 'text-zinc-500'}`}>
                                                <i className={`ph ${m.icon} text-sm`}></i>{m.label}
                                            </button>
                                        ))}
                                    </div>

                                    {esEfectivo && (
                                        <div className="flex justify-between items-center">
                                            <span className="text-zinc-500 font-medium text-sm">Recibido:</span>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => setAmountPaid(total.toFixed(2))} className="px-3 py-2 text-xs font-bold text-zinc-500 bg-zinc-200/60 hover:bg-zinc-300 hover:text-zinc-800 rounded-lg transition-colors">Exacto</button>
                                                <div className="relative w-24 sm:w-28">
                                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 font-medium">$</span>
                                                    <input type="number" inputMode="decimal" min={total} step="0.5" placeholder="0.00" value={amountPaid} onChange={e => setAmountPaid(e.target.value)}
                                                        className="w-full pl-7 pr-3 py-2.5 bg-white border border-zinc-200 rounded-xl focus:ring-2 focus:ring-zinc-950/10 focus:border-zinc-950 outline-none text-right font-bold text-zinc-900 transition-all shadow-sm" />
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                    {esEfectivo && isPaymentValid && (
                                        <div className="flex justify-between items-center pt-3 border-t border-zinc-200/50">
                                            <span className="text-zinc-500 font-medium text-sm">Cambio:</span>
                                            <span className="text-xl font-bold text-emerald-500 tracking-tight">{money(change)}</span>
                                        </div>

                                    <label className="flex items-center gap-2 text-sm text-zinc-600 cursor-pointer select-none pt-1">

                                </div>
                            )}

                    </div>
                </div>
