        }

        // =====================================================================
        //  INVENTARIO (con tasa de IVA por producto)
        // =====================================================================
        // Tasa de ISR que se usa para estimar por artículo
        function tasaIsrActual(ventas, gastos, config) {
            const mes = monthKey(Date.now());
            const c = calcMes(ventas, gastos, mes, config);
            if (config.regimen === '612') {
                const isr = calcISR(ventas, gastos, mes, config).isr;
                const util = c.base - c.deduccion;
                return { tasa: util > 0 ? isr / util : 0, sobre: 'utilidad', texto: util > 0 ? `${(isr / util * 100).toFixed(2)}% efectivo sobre la utilidad (estimado del mes)` : 'sin utilidad registrada este mes' };
            }
            const t = resicoTasa(c.base) / 100;
            return { tasa: t, sobre: 'venta', texto: `${(t * 100).toFixed(2)}% RESICO sobre el precio sin IVA (según tus ventas del mes)` };
        }

        // Desglose de un precio: cuánto es IVA, cuánto ISR y cuánto te queda
        function desglosar(item, rate, isr, comprasConFactura) {
            const precio = Number(item.price) || 0, costo = Number(item.unitCost) || 0;
            const base = precio / (1 + rate);
            const ivaVenta = precio - base;
            const ivaCompra = comprasConFactura ? costo - costo / (1 + rate) : 0;
            const ivaNeto = ivaVenta - ivaCompra;
            const isrMonto = isr.sobre === 'venta' ? base * isr.tasa : Math.max(0, base - (costo - ivaCompra)) * isr.tasa;
            const teQueda = precio - costo - ivaNeto - isrMonto;
            return { base, ivaVenta, ivaNeto, isr: isrMonto, teQueda, pct: precio ? teQueda / precio * 100 : 0 };
        }

        function InventoryView({ inventory, rateFor, setTaxRates, config, setConfig, ventas, gastos }) {
            const safeInventory = Array.isArray(inventory) ? inventory : [];
            const [busca, setBusca] = useState('');
            const toggleRate = id => {
                const next = rateFor(id) > 0 ? 0 : 0.16;
                setTaxRates(prev => ({ ...prev, [id]: next }));
            };
            const isr = useMemo(() => tasaIsrActual(ventas, gastos, config), [ventas, gastos, config]);
            const conFactura = !!config.comprasConFactura;
            const ejemplo = desglosar({ price: 100, unitCost: 0 }, config.ivaDefault, isr, false);
            const lista = safeInventory.filter(i => !busca || String(i.name).toLowerCase().includes(busca.toLowerCase()));
            const th = "py-3 px-4";

            return (
                <div className="flex-1 bg-white rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-zinc-200 flex flex-col h-[calc(100vh-7rem)] md:h-[calc(100vh-4rem)] overflow-hidden max-w-7xl mx-auto w-full">
                    <div className="p-5 md:p-6 border-b border-zinc-100 flex flex-col gap-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h2 className="text-xl font-bold text-zinc-950 tracking-tight">Inventario e impuestos por artículo</h2>
                                <p className="text-sm text-zinc-400 mt-1">De cada precio: cuánto es IVA, cuánto ISR y cuánto te queda después de pagar el producto. Toca la tasa de IVA para cambiarla (libros y revistas: 0%).</p>
                            </div>
                            <input value={busca} onChange={e => setBusca(e.target.value)} placeholder="Buscar artículo..." className="w-full sm:w-56 p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm outline-none focus:border-zinc-950" />
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-3 text-xs">
                            <div className="bg-zinc-50 border border-zinc-100 rounded-2xl p-3">
                                <div className="font-semibold text-zinc-700">Por cada $100 que vendes ({Math.round(config.ivaDefault * 100)}% IVA)</div>
                                <div className="text-zinc-500 mt-1">IVA {money(ejemplo.ivaVenta)} · ISR {isr.sobre === 'venta' ? money(ejemplo.isr) : 'según utilidad'} · sin contar el costo del producto</div>
                            </div>
                            <div className="bg-zinc-50 border border-zinc-100 rounded-2xl p-3">
                                <div className="font-semibold text-zinc-700">ISR usado</div>
                                <div className="text-zinc-500 mt-1">{isr.texto}</div>
                            </div>
                            <label className="bg-zinc-50 border border-zinc-100 rounded-2xl p-3 flex items-center gap-3 cursor-pointer select-none">
                                <input type="checkbox" checked={conFactura} onChange={e => setConfig(prev => ({ ...CONFIG_DEFAULT, ...prev, comprasConFactura: e.target.checked }))} className="w-4 h-4 accent-zinc-950" />
                                <span><span className="font-semibold text-zinc-700">Compro mi mercancía con factura</span><span className="block text-zinc-500 mt-0.5">Si sí, el IVA de tu compra se resta del IVA que pagas.</span></span>
                            </label>
                        </div>
                    </div>
                    <div className="overflow-x-auto flex-1 no-scrollbar">
                        <table className="w-full text-left border-collapse whitespace-nowrap">
                            <thead className="bg-zinc-50/80 text-zinc-500 text-[11px] uppercase tracking-wider font-semibold border-b border-zinc-200 sticky top-0">
                                <tr>
                                    <th className={th}>Artículo</th>
                                    <th className={th + " text-right"}>Costo</th>
                                    <th className={th + " text-right"}>Precio</th>
                                    <th className={th + " text-center"}>Tasa IVA</th>
                                    <th className={th + " text-right"}>Sin IVA</th>
                                    <th className={th + " text-right"}>IVA a pagar</th>
                                    <th className={th + " text-right"}>ISR</th>
                                    <th className={th + " text-right"}>Te queda</th>
                                    <th className={th + " text-right"}>Stock</th>
                                    <th className={th + " text-center"}>Estado</th>
                                </tr>
                            </thead>
                            <tbody className="text-sm">
                                {lista.length === 0 ? (
                                    <tr><td colSpan="10" className="text-center py-16 text-zinc-400 font-medium">No hay productos sincronizados.</td></tr>
                                ) : (
                                    lista.map(item => {
                                        const isService = item.stock > 900000;
                                        const isOut = !isService && item.stock <= 0;
                                        const isLowStock = !isService && item.stock <= (item.minStock || 2) && !isOut;
                                        const rate = rateFor(item.id);
                                        const d = desglosar(item, rate, isr, conFactura);
                                        const td = "py-3 px-4";
                                        return (
                                            <tr key={item.id} className="border-b border-zinc-50 hover:bg-zinc-50/50 transition-colors">
                                                <td className={td + " font-medium text-zinc-900 max-w-[220px] truncate"} title={item.name}>{item.name}</td>
                                                <td className={td + " text-right text-zinc-500"}>{money(item.unitCost)}</td>
                                                <td className={td + " text-right font-semibold text-zinc-900"}>{money(item.price)}</td>
                                                <td className={td + " text-center"}>
                                                    <button onClick={() => toggleRate(item.id)} className={`px-2.5 py-1 rounded-md text-[11px] font-bold border transition-colors ${rate > 0 ? 'bg-white border-zinc-200 text-zinc-700 hover:border-zinc-400' : 'bg-sky-50 border-sky-100 text-sky-700 hover:border-sky-300'}`}>
                                                        {Math.round(rate * 100)}%
                                                    </button>
                                                </td>
                                                <td className={td + " text-right text-zinc-500"}>{money(d.base)}</td>
                                                <td className={td + " text-right text-amber-600"}>{money(d.ivaNeto)}</td>
                                                <td className={td + " text-right text-sky-700"}>{money(d.isr)}</td>
                                                <td className={td + ` text-right font-semibold ${d.teQueda < 0 ? 'text-red-600' : 'text-emerald-600'}`} title={`${d.pct.toFixed(0)}% del precio`}>
                                                    {money(d.teQueda)}<span className="block text-[10px] font-normal text-zinc-400">{d.pct.toFixed(0)}% del precio</span>
                                                </td>
                                                <td className={td + " text-right font-medium text-zinc-600"}>{isService ? '∞' : item.stock}</td>
                                                <td className={td + " text-center"}>
                                                    {isService ? <span className="px-2.5 py-1 bg-zinc-100 text-zinc-600 rounded-md text-[10px] uppercase font-bold tracking-wider">Servicio</span>
                                                    : isOut ? <span className="px-2.5 py-1 bg-red-50 text-red-600 border border-red-100 rounded-md text-[10px] uppercase font-bold tracking-wider">Agotado</span>
                                                    : isLowStock ? <span className="px-2.5 py-1 bg-amber-50 text-amber-600 border border-amber-100 rounded-md text-[10px] uppercase font-bold tracking-wider">Bajo</span>
                                                    : <span className="px-2.5 py-1 text-emerald-600 font-medium text-xs">OK</span>}
                                                </td>
                                            </tr>
                                        );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // =====================================================================
        //  DESEOS
        // =====================================================================
        function MissingView({ missingItems, newMissing, setNewMissing, handleAddMissing }) {
            const safeMissing = Array.isArray(missingItems) ? missingItems : [];
            return (
                <div className="flex-1 max-w-2xl mx-auto w-full flex flex-col gap-6 h-[calc(100vh-7rem)] md:h-[calc(100vh-4rem)]">
                    <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-zinc-200 flex-shrink-0">
                        <div className="mb-6">
                            <h2 className="text-xl font-bold text-zinc-950 tracking-tight">Registro de Faltantes</h2>
                            <p className="text-sm text-zinc-400 mt-1">Anota los productos que te piden y no tienes en bodega.</p>
                        </div>
                        <form onSubmit={handleAddMissing} className="flex flex-col sm:flex-row gap-3">
                            <input required type="text" placeholder="Ej. Foamy escarchado verde..." value={newMissing} onChange={e => setNewMissing(e.target.value)}
                                className="flex-1 p-3.5 bg-zinc-50 border border-zinc-200 rounded-2xl outline-none focus:ring-2 focus:ring-zinc-950/10 focus:border-zinc-950 transition-all text-sm" />
                            <button type="submit" className="bg-zinc-950 text-white px-8 py-3.5 rounded-2xl font-semibold hover:bg-zinc-800 active:scale-95 transition-all text-sm">Registrar</button>
                        </form>
                    </div>
                    <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-zinc-200 flex-1 flex flex-col overflow-hidden">
                        <h2 className="text-sm font-bold text-zinc-400 uppercase tracking-widest mb-6">Lista de Deseos Global</h2>
                        <div className="flex flex-col gap-3 overflow-y-auto no-scrollbar pb-10">
                            {safeMissing.length === 0 ? (
                                <div className="text-center mt-12 text-zinc-400">
                                    <i className="ph-light ph-check-circle text-4xl mb-3 text-zinc-300"></i>
                                    <p className="text-sm font-medium">No hay faltantes registrados.</p>
                                </div>
                            ) : (
                                [...safeMissing].sort((a, b) => b.count - a.count).map((item, index) => (
                                    <div key={item.id} style={{ animationDelay: `${index * 40}ms` }} className="animate-fade-in-up flex justify-between items-center p-4 bg-zinc-50 rounded-2xl border border-zinc-100 hover:border-zinc-200 transition-colors">
                                        <span className="font-medium text-zinc-800 text-sm">{item.name}</span>
                                        <span className="bg-white border border-zinc-200 text-zinc-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm flex items-center gap-1.5">
                                            <i className="ph-fill ph-trend-up text-zinc-400"></i> {item.count}
                                        </span>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // =====================================================================
        //  MÓDULO FISCAL
        // =====================================================================
        const Card = ({ children, className = '' }) => (
            <div className={`bg-white rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-zinc-200 p-5 sm:p-6 ${className}`}>{children}</div>
        );
        const Stat = ({ label, value, hint, tone = 'zinc' }) => {
            const tones = { zinc: 'text-zinc-950', green: 'text-emerald-600', amber: 'text-amber-600', red: 'text-red-600', sky: 'text-sky-700' };
            return (
                <div className="bg-zinc-50 border border-zinc-100 rounded-2xl p-4">
                    <div className="text-[11px] uppercase tracking-wider font-semibold text-zinc-400">{label}</div>
                    <div className={`text-xl sm:text-2xl font-bold tracking-tight mt-1 ${tones[tone]}`}>{value}</div>
                    {hint && <div className="text-xs text-zinc-400 mt-1">{hint}</div>}
                </div>
            );
        };
        const Row = ({ k, v, strong, muted }) => (
            <div className={`flex justify-between py-2 text-sm ${strong ? 'border-t border-zinc-200 mt-1 pt-3 font-semibold text-zinc-950' : ''}`}>
                <span className={muted ? 'text-zinc-400' : 'text-zinc-500'}>{k}</span><span className={strong ? '' : 'text-zinc-900 font-medium'}>{v}</span>
            </div>
        );
        const inputCls = "w-full p-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:ring-2 focus:ring-zinc-950/10 focus:border-zinc-950 transition-all text-sm";

        function FiscalView(props) {
            const [sub, setSub] = useState('resumen');
            const done = Object.values(props.checklist).filter(Boolean).length;
            const tabs = [
                { id: 'resumen', label: 'Resumen', icon: 'ph-chart-pie-slice' },
                { id: 'gastos', label: 'Gastos', icon: 'ph-receipt' },
                { id: 'checklist', label: `Checklist ${done}/${CHECKLIST_TOTAL}`, icon: 'ph-list-checks' },
                { id: 'ajustes', label: 'Ajustes', icon: 'ph-gear-six' },
            ];
            return (
                <div className="max-w-5xl mx-auto w-full flex flex-col gap-5">
                    <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                        <div>
                            <h2 className="text-2xl font-bold text-zinc-950 tracking-tight">Control fiscal</h2>
                            <p className="text-sm text-zinc-400 mt-1">{REGIMENES[props.config.regimen]}{props.config.rfc ? ` · ${props.config.rfc}` : ''}</p>
                        </div>
                    </div>
                    <div className="flex gap-1.5 bg-zinc-100 p-1 rounded-2xl overflow-x-auto no-scrollbar">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => setSub(t.id)}
                                className={`flex-1 min-w-fit px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition-all whitespace-nowrap ${sub === t.id ? 'bg-white text-zinc-950 shadow-sm' : 'text-zinc-500 hover:text-zinc-800'}`}>
                                <i className={`ph ${t.icon} text-base`}></i>{t.label}
                            </button>
                        ))}
                    </div>
                    {sub === 'resumen' && <ResumenFiscal {...props} checklistDone={done} goTo={setSub} />}
                    {sub === 'gastos' && <GastosView {...props} />}
                    {sub === 'checklist' && <ChecklistView {...props} />}
                    {sub === 'ajustes' && <AjustesView {...props} />}
                    <p className="text-[11px] text-zinc-400 leading-relaxed px-1 pb-4">
                        Las cifras son estimaciones con base en lo registrado en este dispositivo y en tasas y tarifas de la LISR/LIVA vigentes a la fecha de esta versión. No sustituyen la declaración ni la asesoría de un contador. Verifica cada enero si el SAT actualizó tarifas o reglas.
                    </p>
                </div>
            );
        }

        // ---------- RESUMEN ----------
        function calcMes(ventas, gastos, mes, config) {
            const vm = ventas.filter(v => monthKey(v.ts) === mes);
            const gm = gastos.filter(g => (g.fecha || '').slice(0, 7) === mes);
            const ingresos = sum(vm, v => v.total);
            const base = sum(vm, v => v.base);
            const ivaTras = sum(vm, v => v.iva);
            const conCfdi = gm.filter(g => g.cfdi);
            const ivaAcred = sum(conCfdi, g => g.iva);
            const deducibles = conCfdi.filter(g => !(g.metodoPago === 'efectivo' && g.total > 2000));
            const deduccion = sum(deducibles, g => g.total - g.iva);
            const sinFactura = vm.filter(v => !v.requiereFactura);
            return {
                vm, gm, ingresos, base, ivaTras, ivaAcred, deduccion,
                ivaNeto: ivaTras - ivaAcred,
                efectivo: sum(vm.filter(v => v.metodoPago === 'efectivo'), v => v.total),
                banco: sum(vm.filter(v => v.metodoPago === 'tarjeta' || v.metodoPago === 'transferencia'), v => v.total),
                sinMetodo: sum(vm.filter(v => !['efectivo', 'tarjeta', 'transferencia'].includes(v.metodoPago)), v => v.total),
                deHistorial: vm.filter(v => v.origen === 'historial').length,
                globalTotal: sum(sinFactura, v => v.total), globalBase: sum(sinFactura, v => v.base), globalIva: sum(sinFactura, v => v.iva),
                gastosTotal: sum(gm, g => g.total),
                gastosSinCfdi: sum(gm.filter(g => !g.cfdi), g => g.total),
                gastosEfectivoMayor: gm.filter(g => g.cfdi && g.metodoPago === 'efectivo' && g.total > 2000).length,
            };
        }

        function calcISR(ventas, gastos, mes, config) {
            const [y, m] = mes.split('-').map(Number);
            const reg = config.regimen;
            const actual = calcMes(ventas, gastos, mes, config);
            const ytdIngresos = sum(ventas.filter(v => { const d = new Date(v.ts); return d.getFullYear() === y && d.getMonth() + 1 <= m; }), v => v.base);
            if (reg === '612') {
                const utilidadHasta = meses => {
                    let u = 0;
                    for (let i = 1; i <= meses; i++) {
                        const k = `${y}-${String(i).padStart(2, '0')}`;
                        const c = calcMes(ventas, gastos, k, config);
                        u += c.base - c.deduccion;
                    }
                    return u;
                };
                const uAct = utilidadHasta(m), uPrev = m > 1 ? utilidadHasta(m - 1) : 0;
                const isrAct = isrTarifaAcumulada(Math.max(0, uAct), m);
                const isrPrev = m > 1 ? isrTarifaAcumulada(Math.max(0, uPrev), m - 1) : 0;
                return { isr: Math.max(0, isrAct - isrPrev), detalle: `Utilidad acumulada ene–${MESES[m - 1].toLowerCase()}: ${money(uAct)} · tarifa acumulada art. 106 LISR menos pagos previos estimados`, ytdIngresos };
            }
            const tasa = resicoTasa(actual.base);
            return { isr: actual.base * tasa / 100, tasa, detalle: `${tasa.toFixed(2)}% sobre ingresos cobrados sin IVA (${money(actual.base)})${reg === 'none' ? ' · referencia como si estuvieras en RESICO' : ''}`, ytdIngresos };
        }

        function proximosVencimientos(config, mes) {
            const hoy = new Date();
            const list = [];
            const y = hoy.getFullYear(), mi = hoy.getMonth();
            // Declaración mensual del mes en curso y, si aún no vence, la del mes anterior
            const prev = new Date(y, mi - 1, 1);
            const vPrev = nextBusinessDay(new Date(y, mi, 17));
            if (daysUntil(vPrev) >= 0) list.push({ t: `Declaración mensual ISR/IVA de ${MESES[prev.getMonth()].toLowerCase()}`, d: vPrev, icon: 'ph-file-text' });
            list.push({ t: `Declaración mensual ISR/IVA de ${MESES[mi].toLowerCase()}`, d: nextBusinessDay(new Date(y, mi + 1, 17)), icon: 'ph-file-text' });
            // Factura global
            if (config.periodicidadGlobal === 'bimestral') {
                const finBim = new Date(y, mi % 2 === 0 ? mi + 2 : mi + 1, 1);
                list.push({ t: 'Factura global del bimestre (24 h tras el cierre)', d: finBim, icon: 'ph-receipt' });
            } else if (config.periodicidadGlobal === 'mensual') {
                list.push({ t: `Factura global de ${MESES[mi].toLowerCase()} (24 h tras el cierre)`, d: new Date(y, mi + 1, 1), icon: 'ph-receipt' });
            }
            // Anual
            const anual = new Date(mi <= 3 ? y : y + 1, 3, 30);
            list.push({ t: `Declaración anual ${anual.getFullYear() - 1}`, d: anual, icon: 'ph-calendar-star' });
            // e.firma
            if (config.efirmaVence) {
                const [ey, em, ed] = config.efirmaVence.split('-').map(Number);
                list.push({ t: 'Vence tu e.firma (renuévala antes)', d: new Date(ey, em - 1, ed), icon: 'ph-key' });
            }
            return list.sort((a, b) => a.d - b.d);
        }

        function ResumenFiscal({ ventas, gastos, config, checklistDone, goTo, sync }) {
            const [mes, setMes] = useState(monthKey(Date.now()));
            const meses = useMemo(() => {
                const set = new Set([monthKey(Date.now())]);
                ventas.forEach(v => set.add(monthKey(v.ts)));
                gastos.forEach(g => g.fecha && set.add(g.fecha.slice(0, 7)));
                return [...set].sort().reverse();
            }, [ventas, gastos]);

            const c = calcMes(ventas, gastos, mes, config);
            const isr = calcISR(ventas, gastos, mes, config);
            const venc = proximosVencimientos(config, mes);
            const pendientes = ventas.filter(v => v.requiereFactura && !v.facturada);
            const pct = Math.round(checklistDone / CHECKLIST_TOTAL * 100);
            const limitePct = config.regimen === '626' ? isr.ytdIngresos / RESICO_LIMITE_ANUAL * 100 : 0;

            const marcarFacturada = sync.marcarFacturada;

            return (
                <div className="flex flex-col gap-5">
                    {/* Semáforo general */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <button onClick={() => goTo('checklist')} className="text-left bg-zinc-950 text-white rounded-3xl p-5 hover:bg-zinc-900 transition-colors">
                            <div className="text-[11px] uppercase tracking-wider font-semibold text-zinc-400">Formalización</div>
                            <div className="text-3xl font-bold mt-1">{pct}%</div>
                            <div className="h-1.5 bg-zinc-800 rounded-full mt-3 overflow-hidden"><div className="h-full bg-emerald-400 rounded-full transition-all" style={{ width: `${pct}%` }}></div></div>
                            <div className="text-xs text-zinc-400 mt-2">{checklistDone} de {CHECKLIST_TOTAL} requisitos · ver checklist</div>
                        </button>
                        <Card className="!p-5">
                            <div className="text-[11px] uppercase tracking-wider font-semibold text-zinc-400">Próximo vencimiento</div>
                            {venc[0] && <>
                                <div className={`text-3xl font-bold mt-1 ${daysUntil(venc[0].d) <= 3 ? 'text-red-600' : daysUntil(venc[0].d) <= 7 ? 'text-amber-600' : 'text-zinc-950'}`}>
                                    {daysUntil(venc[0].d) === 0 ? 'Hoy' : `${daysUntil(venc[0].d)} días`}
                                </div>
                                <div className="text-xs text-zinc-500 mt-2 leading-snug">{venc[0].t} · {fmtDate(venc[0].d)}</div>
                            </>}
                        </Card>
                        <Card className="!p-5">
                            <div className="text-[11px] uppercase tracking-wider font-semibold text-zinc-400">Facturas por emitir</div>
                            <div className={`text-3xl font-bold mt-1 ${pendientes.length ? 'text-amber-600' : 'text-emerald-600'}`}>{pendientes.length}</div>
                            <div className="text-xs text-zinc-500 mt-2">Ventas marcadas "requiere factura"</div>
                        </Card>
                    </div>

                    {config.regimen === 'none' && (
                        <div className="bg-amber-50 border border-amber-100 text-amber-800 rounded-2xl p-4 text-sm flex gap-3">
                            <i className="ph-fill ph-warning text-xl flex-shrink-0"></i>
                            <div>Marcaste que aún no estás inscrito. Los impuestos se muestran como referencia (RESICO). Empieza por la sección "SAT · Alta y régimen" del checklist.</div>
                        </div>
                    )}
                    {limitePct >= 80 && (
                        <div className="bg-red-50 border border-red-100 text-red-700 rounded-2xl p-4 text-sm flex gap-3">
                            <i className="ph-fill ph-warning-octagon text-xl flex-shrink-0"></i>
                            <div>Llevas {money(isr.ytdIngresos)} de ingresos en el año ({limitePct.toFixed(0)}% del límite de RESICO de $3.5 M). Si lo rebasas, sales del régimen: revísalo con tu contador.</div>
                        </div>
                    )}

                    {/* Mes */}
                    <Card>
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                            <h3 className="text-lg font-bold text-zinc-950 tracking-tight">Impuestos estimados del mes</h3>
                            <select value={mes} onChange={e => setMes(e.target.value)} className="p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm font-medium outline-none">
                                {meses.map(k => <option key={k} value={k}>{monthLabel(k)}</option>)}
                            </select>
                        </div>
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                            <Stat label="Ventas (con IVA)" value={money(c.ingresos)} hint={`${c.vm.length} tickets`} />
                            <Stat label="ISR estimado" value={money(isr.isr)} tone="sky" hint={config.regimen === '612' ? 'Pago provisional' : `Tasa ${isr.tasa?.toFixed(2)}%`} />
                            <Stat label={c.ivaNeto >= 0 ? 'IVA a pagar' : 'IVA a favor'} value={money(Math.abs(c.ivaNeto))} tone={c.ivaNeto >= 0 ? 'amber' : 'green'} hint="Trasladado − acreditable" />
                            <Stat label="Total a apartar" value={money(isr.isr + Math.max(0, c.ivaNeto))} tone="red" hint={`Vence ${fmtDate(nextBusinessDay(new Date(Number(mes.slice(0, 4)), Number(mes.slice(5)), 17)))}`} />
                        </div>
                        <div className="grid md:grid-cols-2 gap-6">
                            <div>
                                <h4 className="text-xs font-bold text-zinc-400 uppercase tracking-widest mb-2">IVA</h4>
                                <Row k="Ventas sin IVA (base)" v={money(c.base)} />
                                <Row k="IVA trasladado (cobrado)" v={money(c.ivaTras)} />
                                <Row k="IVA acreditable (gastos con CFDI)" v={`− ${money(c.ivaAcred)}`} />
                                <Row k={c.ivaNeto >= 0 ? 'IVA a pagar' : 'Saldo a favor'} v={money(Math.abs(c.ivaNeto))} strong />
                            </div>
                            <div>
                                <h4 className="text-xs font-bold text-zinc-400 uppercase tracking-widest mb-2">ISR</h4>
                                {config.regimen === '612' ? <>
                                    <Row k="Ingresos sin IVA" v={money(c.base)} />
                                    <Row k="Deducciones del mes (CFDI)" v={`− ${money(c.deduccion)}`} />
                                    <Row k="Utilidad del mes" v={money(c.base - c.deduccion)} />
                                </> : <>
                                    <Row k="Ingresos cobrados sin IVA" v={money(c.base)} />
                                    <Row k="Tasa RESICO aplicable" v={`${isr.tasa?.toFixed(2)}%`} />
                                </>}
                                <Row k="ISR estimado" v={money(isr.isr)} strong />
                                <p className="text-[11px] text-zinc-400 mt-2 leading-relaxed">{isr.detalle}</p>
                            </div>
                        </div>
                        {c.deHistorial > 0 && (
                            <p className="text-[11px] text-zinc-400 mt-4 pt-3 border-t border-zinc-100 leading-relaxed">
                                <i className="ph ph-clock-counter-clockwise mr-1"></i>
                                Incluye {c.deHistorial} ticket(s) tomados de la hoja Historial. El IVA se calculó con la tasa de cada producto (16% si no tiene una propia) suponiendo que los precios ya lo incluían.
                            </p>
                        )}
                    </Card>

                    <PeriodosCard ventas={ventas} gastos={gastos} config={config} mesActivo={mes} setMes={setMes} />


                    <div className="grid md:grid-cols-2 gap-5">
                        <Card>
                            <h3 className="text-base font-bold text-zinc-950 mb-3">Factura global · {monthLabel(mes)}</h3>
                            <p className="text-xs text-zinc-400 mb-3">Ventas al público en general sin factura individual. Emítela a RFC XAXX010101000.</p>
                            <Row k="Subtotal" v={money(c.globalBase)} />
                            <Row k="IVA" v={money(c.globalIva)} />
                            <Row k="Total a facturar" v={money(c.globalTotal)} strong />
                            <div className="mt-4 pt-3 border-t border-zinc-100">
                                <Row k="Cobrado en efectivo" v={money(c.efectivo)} muted />
                                <Row k="Cobrado por tarjeta/transferencia" v={money(c.banco)} muted />
                                {c.sinMetodo > 0 && <Row k="Sin método registrado (historial)" v={money(c.sinMetodo)} muted />}
                            </div>
                        </Card>
                        <Card>
                            <h3 className="text-base font-bold text-zinc-950 mb-3">Próximos vencimientos</h3>
                            <div className="flex flex-col gap-2">
                                {venc.map((v, i) => {
                                    const n = daysUntil(v.d);
                                    return (
                                        <div key={i} className="flex items-center gap-3 p-3 rounded-2xl bg-zinc-50 border border-zinc-100">
                                            <i className={`ph ${v.icon} text-xl text-zinc-400`}></i>
                                            <div className="flex-1 min-w-0">
                                                <div className="text-sm font-medium text-zinc-800 truncate">{v.t}</div>
                                                <div className="text-xs text-zinc-400">{fmtDate(v.d)}</div>
                                            </div>
                                            <span className={`text-xs font-bold px-2 py-1 rounded-lg ${n < 0 ? 'bg-red-100 text-red-700' : n <= 3 ? 'bg-red-50 text-red-600' : n <= 7 ? 'bg-amber-50 text-amber-600' : 'bg-white border border-zinc-200 text-zinc-500'}`}>
                                                {n < 0 ? 'Vencido' : n === 0 ? 'Hoy' : `${n} d`}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                        </Card>
                    </div>

                    {pendientes.length > 0 && (
                        <Card>
                            <h3 className="text-base font-bold text-zinc-950 mb-3">Ventas pendientes de facturar</h3>
                            <div className="flex flex-col gap-2">
                                {pendientes.map(v => (
                                    <div key={v.id} className="flex items-center justify-between gap-3 p-3 rounded-2xl bg-amber-50/50 border border-amber-100">
                                        <div>
                                            <div className="text-sm font-semibold text-zinc-900">{money(v.total)} <span className="text-xs font-normal text-zinc-400 capitalize">· {v.metodoPago}</span></div>
                                            <div className="text-xs text-zinc-400">{new Date(v.ts).toLocaleString('es-MX')} · {v.piezas} pzas</div>
                                        </div>
                                        <button onClick={() => marcarFacturada(v.id)} className="text-xs font-semibold bg-zinc-950 text-white px-3 py-2 rounded-xl hover:bg-zinc-800">Ya la facturé</button>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    )}

                    {(c.gastosSinCfdi > 0 || c.gastosEfectivoMayor > 0) && (
                        <div className="bg-sky-50 border border-sky-100 text-sky-800 rounded-2xl p-4 text-sm flex flex-col gap-1">
                            {c.gastosSinCfdi > 0 && <div><i className="ph-fill ph-info mr-1"></i>Este mes tienes {money(c.gastosSinCfdi)} en gastos sin factura: ese IVA no se puede acreditar.</div>}
                            {c.gastosEfectivoMayor > 0 && <div><i className="ph-fill ph-info mr-1"></i>{c.gastosEfectivoMayor} gasto(s) mayores a $2,000 pagados en efectivo: no son deducibles para ISR.</div>}
                        </div>
                    )}
                </div>
            );
        }

        // ---------- RESUMEN POR PERIODO ----------
        function PeriodosCard({ ventas, gastos, config, mesActivo, setMes }) {
            const anios = useMemo(() => {
                const s = new Set([String(new Date().getFullYear())]);
                ventas.forEach(v => s.add(String(new Date(v.ts).getFullYear())));
                return [...s].sort().reverse();
            }, [ventas]);
            const [anio, setAnio] = useState(mesActivo.slice(0, 4));

            const filas = useMemo(() => {
                const hoy = monthKey(Date.now());
                const out = [];
                for (let m = 1; m <= 12; m++) {
                    const k = `${anio}-${String(m).padStart(2, '0')}`;
                    if (k > hoy) break;
                    const c = calcMes(ventas, gastos, k, config);
                    if (!c.vm.length && !c.gm.length) continue;
                    const isr = calcISR(ventas, gastos, k, config);
                    out.push({
                        k, tickets: c.vm.length, ventas: c.ingresos, ivaTras: c.ivaTras, ivaAcred: c.ivaAcred,
                        ivaNeto: c.ivaNeto, isr: isr.isr, pagar: isr.isr + Math.max(0, c.ivaNeto),
                        vence: nextBusinessDay(new Date(Number(anio), m, 17)), enCurso: k === hoy
                    });
                }
                return out;
            }, [ventas, gastos, config, anio]);

            const tot = {
                ventas: sum(filas, f => f.ventas), ivaNeto: sum(filas, f => Math.max(0, f.ivaNeto)),
                isr: sum(filas, f => f.isr), pagar: sum(filas, f => f.pagar)
            };

            return (
                <Card>
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-1">
                        <h3 className="text-lg font-bold text-zinc-950 tracking-tight">Impuestos por periodo</h3>
                        <select value={anio} onChange={e => setAnio(e.target.value)} className="p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm font-medium outline-none">
                            {anios.map(a => <option key={a} value={a}>{a}</option>)}
                        </select>
                    </div>
                    <p className="text-xs text-zinc-400 mb-4">Lo que correspondería declarar cada mes con tus ventas registradas. Toca un mes para ver su detalle arriba.</p>
                    {filas.length === 0 ? (
                        <div className="text-center py-10 text-zinc-400 text-sm">Sin ventas registradas en {anio}.</div>
                    ) : (
                        <div className="overflow-x-auto no-scrollbar -mx-2">
                            <table className="w-full text-sm whitespace-nowrap">
                                <thead className="text-[11px] uppercase tracking-wider text-zinc-400 font-semibold">
                                    <tr className="border-b border-zinc-100">
                                        <th className="text-left py-2 px-2">Mes</th>
                                        <th className="text-right py-2 px-2">Ventas</th>
                                        <th className="text-right py-2 px-2">IVA neto</th>
                                        <th className="text-right py-2 px-2">ISR</th>
                                        <th className="text-right py-2 px-2">A pagar</th>
                                        <th className="text-right py-2 px-2">Vence</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filas.map(f => (
                                        <tr key={f.k} onClick={() => setMes(f.k)}
                                            className={`border-b border-zinc-50 cursor-pointer transition-colors ${f.k === mesActivo ? 'bg-zinc-100' : 'hover:bg-zinc-50'}`}>
                                            <td className="py-2.5 px-2 font-medium text-zinc-900">
                                                {MESES[Number(f.k.slice(5)) - 1]}
                                                {f.enCurso && <span className="ml-2 text-[10px] font-bold uppercase text-sky-600">en curso</span>}
                                                <div className="text-[11px] text-zinc-400 font-normal">{f.tickets} tickets</div>
                                            </td>
                                            <td className="py-2.5 px-2 text-right text-zinc-700">{money(f.ventas)}</td>
                                            <td className={`py-2.5 px-2 text-right ${f.ivaNeto < 0 ? 'text-emerald-600' : 'text-zinc-700'}`}>{f.ivaNeto < 0 ? `a favor ${money(-f.ivaNeto)}` : money(f.ivaNeto)}</td>
                                            <td className="py-2.5 px-2 text-right text-zinc-700">{money(f.isr)}</td>
                                            <td className="py-2.5 px-2 text-right font-semibold text-zinc-950">{money(f.pagar)}</td>
                                            <td className="py-2.5 px-2 text-right text-xs text-zinc-400">{fmtDate(f.vence)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                                <tfoot>
                                    <tr className="font-semibold text-zinc-950">
                                        <td className="py-3 px-2">Total {anio}</td>
                                        <td className="py-3 px-2 text-right">{money(tot.ventas)}</td>
                                        <td className="py-3 px-2 text-right">{money(tot.ivaNeto)}</td>
                                        <td className="py-3 px-2 text-right">{money(tot.isr)}</td>
                                        <td className="py-3 px-2 text-right text-red-600">{money(tot.pagar)}</td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    )}
                    <p className="text-[11px] text-zinc-400 mt-3 leading-relaxed">
                        El saldo de IVA a favor de un mes no se resta aquí de los siguientes; tu contador puede acreditarlo o pedir su devolución. Si aún no estás inscrito en el SAT, estas cifras son una referencia de lo que pagarías; si los meses pasados se tendrían que declarar depende de la fecha de inicio de operaciones que registres, así que revísalo con tu contador.
                    </p>
                </Card>
            );
        }

        // ---------- GASTOS ----------
        const CATEGORIAS = ['Mercancía para venta', 'Renta del local', 'Luz, agua, internet', 'Insumos (papel, tóner, tinta)', 'Equipo y mobiliario', 'Mantenimiento', 'Comisiones bancarias', 'Otros'];

        function GastosView({ gastos, notify, sync }) {
            const vacio = { fecha: todayISO(), proveedor: '', concepto: '', categoria: CATEGORIAS[0], total: '', tasa: '0.16', cfdi: true, metodoPago: 'transferencia' };
            const [f, setF] = useState(vacio);
            const [mes, setMes] = useState(monthKey(Date.now()));
            const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));

            const guardar = e => {
                e.preventDefault();
                const total = parseFloat(f.total);
                if (!total || total <= 0) return;
                const tasa = parseFloat(f.tasa);
                const iva = f.cfdi ? total - total / (1 + tasa) : 0;
                sync.agregarGasto({ id: Date.now(), ...f, total: +total.toFixed(2), tasa, iva: +iva.toFixed(2) });
                setF({ ...vacio, fecha: f.fecha, metodoPago: f.metodoPago });
                notify('Gasto registrado');
            };
            const borrar = id => { if (confirm('¿Eliminar este gasto? También se borra del Sheet.')) sync.borrarGasto(id); };

            const delMes = gastos.filter(g => (g.fecha || '').slice(0, 7) === mes).sort((a, b) => b.fecha.localeCompare(a.fecha));
            const meses = [...new Set([monthKey(Date.now()), ...gastos.map(g => g.fecha.slice(0, 7))])].sort().reverse();
            const totalNum = parseFloat(f.total) || 0;

            return (
                <div className="grid lg:grid-cols-5 gap-5">
                    <Card className="lg:col-span-2 h-fit">
                        <h3 className="text-lg font-bold text-zinc-950 tracking-tight mb-1">Registrar gasto</h3>
                        <p className="text-xs text-zinc-400 mb-4">Compras de mercancía, renta, servicios. Sirve para IVA acreditable y, en régimen 612, para deducir ISR.</p>
                        <form onSubmit={guardar} className="flex flex-col gap-3">
                            <div className="grid grid-cols-2 gap-3">
                                <input type="date" required value={f.fecha} onChange={e => set('fecha', e.target.value)} className={inputCls} />
                                <div className="relative">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-sm">$</span>
                                    <input type="number" inputMode="decimal" step="0.01" min="0" required placeholder="Total" value={f.total} onChange={e => set('total', e.target.value)} className={inputCls + ' pl-7'} />
                                </div>
                            </div>
                            <input type="text" placeholder="Proveedor (ej. Distribuidora Escolar)" value={f.proveedor} onChange={e => set('proveedor', e.target.value)} className={inputCls} />
                            <input type="text" placeholder="Concepto (opcional)" value={f.concepto} onChange={e => set('concepto', e.target.value)} className={inputCls} />
                            <select value={f.categoria} onChange={e => set('categoria', e.target.value)} className={inputCls}>
                                {CATEGORIAS.map(c => <option key={c}>{c}</option>)}
                            </select>
                            <div className="grid grid-cols-2 gap-3">
                                <select value={f.tasa} onChange={e => set('tasa', e.target.value)} className={inputCls}>
                                    <option value="0.16">IVA 16%</option>
                                    <option value="0">IVA 0% / exento</option>
                                </select>
                                <select value={f.metodoPago} onChange={e => set('metodoPago', e.target.value)} className={inputCls}>
                                    <option value="transferencia">Transferencia</option>
                                    <option value="tarjeta">Tarjeta</option>
                                    <option value="efectivo">Efectivo</option>
                                </select>
                            </div>
                            <label className="flex items-center gap-2 text-sm text-zinc-600 cursor-pointer select-none">
                                <input type="checkbox" checked={f.cfdi} onChange={e => set('cfdi', e.target.checked)} className="w-4 h-4 accent-zinc-950" />
                                Tengo la factura (CFDI) a mi RFC
                            </label>
                            {f.cfdi && f.metodoPago === 'efectivo' && totalNum > 2000 && (
                                <div className="text-xs bg-amber-50 border border-amber-100 text-amber-700 rounded-xl p-3">Pagado en efectivo y mayor a $2,000: no será deducible para ISR (el IVA sí cuenta si tienes CFDI).</div>
                            )}
                            {!f.cfdi && <div className="text-xs bg-zinc-50 border border-zinc-100 text-zinc-500 rounded-xl p-3">Sin factura se registra como gasto, pero no genera IVA acreditable ni deducción.</div>}
                            <button type="submit" className="bg-zinc-950 text-white py-3.5 rounded-2xl font-semibold hover:bg-zinc-800 active:scale-95 transition-all text-sm mt-1">Guardar gasto</button>
                        </form>
                    </Card>

                    <Card className="lg:col-span-3">
                        <div className="flex items-center justify-between gap-3 mb-4">
                            <h3 className="text-lg font-bold text-zinc-950 tracking-tight">Gastos del mes</h3>
                            <select value={mes} onChange={e => setMes(e.target.value)} className="p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm font-medium outline-none">
                                {meses.map(k => <option key={k} value={k}>{monthLabel(k)}</option>)}
                            </select>
                        </div>
                        <div className="grid grid-cols-3 gap-2 mb-4">
                            <Stat label="Total" value={money(sum(delMes, g => g.total))} />
                            <Stat label="IVA acred." value={money(sum(delMes, g => g.iva))} tone="green" />
                            <Stat label="Sin CFDI" value={money(sum(delMes.filter(g => !g.cfdi), g => g.total))} tone="amber" />
                        </div>
                        {delMes.length === 0 ? (
                            <div className="text-center py-12 text-zinc-400 text-sm"><i className="ph-light ph-receipt text-4xl block mb-2 text-zinc-300"></i>Sin gastos registrados este mes.</div>
                        ) : (
                            <div className="flex flex-col gap-2 max-h-[60vh] overflow-y-auto no-scrollbar">
                                {delMes.map(g => (
                                    <div key={g.id} className="flex items-center gap-3 p-3 rounded-2xl bg-zinc-50 border border-zinc-100">
                                        <div className="flex-1 min-w-0">
                                            <div className="text-sm font-medium text-zinc-900 truncate">{g.proveedor || g.categoria}{g.concepto ? ` · ${g.concepto}` : ''}</div>
                                            <div className="text-xs text-zinc-400 flex flex-wrap gap-x-2">
                                                <span>{g.fecha}</span><span>{g.categoria}</span><span className="capitalize">{g.metodoPago}</span>
                                                {g.cfdi ? <span className="text-emerald-600 font-semibold">CFDI</span> : <span className="text-amber-600 font-semibold">Sin factura</span>}
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-sm font-semibold text-zinc-950">{money(g.total)}</div>
                                            <div className="text-[11px] text-zinc-400">IVA {money(g.iva)}</div>
                                        </div>
                                        <button onClick={() => borrar(g.id)} className="text-zinc-300 hover:text-red-500 p-1"><i className="ph ph-trash text-lg"></i></button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </Card>
                </div>
            );
        }

        // ---------- CHECKLIST ----------
        function ChecklistView({ checklist, setChecklist, config }) {
            const [open, setOpen] = useState(null);
            const toggle = id => setChecklist(prev => ({ ...prev, [id]: !prev[id] }));
            return (
                <div className="flex flex-col gap-4">
                    {CHECKLIST.map(g => {
                        const hechos = g.items.filter(i => checklist[i.id]).length;
                        const pct = Math.round(hechos / g.items.length * 100);
                        return (
                            <Card key={g.grupo} className="!p-0 overflow-hidden">
                                <div className="flex items-center gap-3 px-5 sm:px-6 pt-5 pb-3">
                                    <div className="w-10 h-10 rounded-xl bg-zinc-100 flex items-center justify-center"><i className={`ph ${g.icon} text-xl text-zinc-700`}></i></div>
                                    <div className="flex-1">
                                        <h3 className="text-base font-bold text-zinc-950">{g.grupo}</h3>
                                        <div className="h-1.5 bg-zinc-100 rounded-full mt-2 overflow-hidden"><div className={`h-full rounded-full transition-all ${pct === 100 ? 'bg-emerald-500' : 'bg-zinc-900'}`} style={{ width: `${pct}%` }}></div></div>
                                    </div>
                                    <span className="text-xs font-bold text-zinc-500">{hechos}/{g.items.length}</span>
                                </div>
                                <div className="px-2 sm:px-3 pb-3">
                                    {g.items.map(it => (
                                        <div key={it.id} className="rounded-2xl hover:bg-zinc-50 transition-colors">
                                            <div className="flex items-start gap-3 p-3">
                                                <button onClick={() => toggle(it.id)} className={`mt-0.5 w-6 h-6 rounded-lg border-2 flex-shrink-0 flex items-center justify-center transition-all ${checklist[it.id] ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-zinc-300 bg-white'}`}>
                                                    {checklist[it.id] && <i className="ph-bold ph-check text-sm"></i>}
                                                </button>
                                                <button onClick={() => setOpen(open === it.id ? null : it.id)} className="flex-1 text-left">
                                                    <div className={`text-sm font-medium ${checklist[it.id] ? 'text-zinc-400 line-through' : 'text-zinc-900'}`}>{it.t}</div>
                                                    {open === it.id && <div className="text-xs text-zinc-500 mt-1.5 leading-relaxed animate-fade-in-up">{it.d}</div>}
                                                </button>
                                                <button onClick={() => setOpen(open === it.id ? null : it.id)} className="text-zinc-300 p-0.5"><i className={`ph ph-caret-down transition-transform ${open === it.id ? 'rotate-180' : ''}`}></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        );
                    })}
                </div>
            );
        }

        // ---------- AJUSTES ----------
        const Field = ({ label, children, hint }) => (
            <label className="flex flex-col gap-1.5">
                <span className="text-xs font-semibold text-zinc-500">{label}</span>
                {children}
                {hint && <span className="text-[11px] text-zinc-400">{hint}</span>}
            </label>
        );

        function AjustesView({ config, setConfig, ventas, setVentas, gastos, setGastos, checklist, setChecklist, taxRates, setTaxRates, notify, sync }) {
            const fileRef = useRef(null);
            const set = (k, v) => setConfig(prev => ({ ...CONFIG_DEFAULT, ...prev, [k]: v }));

            const exportar = () => {
                const data = { version: 1, exportado: new Date().toISOString(), config, ventas, gastos, checklist, taxRates };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `respaldo-papeleria-${todayISO()}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
            };
            const importar = e => {
                const file = e.target.files[0];
                if (!file) return;
                const r = new FileReader();
                r.onload = () => {
                    try {
                        const d = JSON.parse(r.result);
                        if (!confirm('Se agregarán al Sheet las ventas y gastos del respaldo que no existan, y se restaurarán régimen, checklist y tasas. ¿Continuar?')) return;
                        const idsV = new Set(ventas.map(v => String(v.id))), idsG = new Set(gastos.map(g => String(g.id)));
                        const nv = (d.ventas || []).filter(v => !idsV.has(String(v.id)));
                        const ng = (d.gastos || []).filter(g => !idsG.has(String(g.id)));
                        setVentas(prev => [...nv, ...prev].sort((a, b) => b.ts - a.ts));
                        setGastos(prev => [...ng, ...prev]);
                        if (d.config) setConfig(d.config);
                        if (d.checklist) setChecklist(d.checklist);
                        if (d.taxRates) setTaxRates(d.taxRates);
                        if (nv.length || ng.length) sync.importar(nv, ng);
                        notify(`Respaldo restaurado: ${nv.length} ventas y ${ng.length} gastos nuevos`);
                    } catch { notify('Archivo de respaldo inválido'); }
                };
                r.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="grid md:grid-cols-2 gap-5">
                    <Card>
                        <h3 className="text-lg font-bold text-zinc-950 tracking-tight mb-4">Datos fiscales</h3>
                        <div className="flex flex-col gap-4">
                            <Field label="Régimen fiscal" hint="Determina cómo se estima el ISR.">
                                <select value={config.regimen} onChange={e => set('regimen', e.target.value)} className={inputCls}>
                                    {Object.entries(REGIMENES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                                </select>
                            </Field>
                            <Field label="Nombre o razón social">
                                <input defaultValue={config.nombre} onBlur={e => set('nombre', e.target.value)} className={inputCls} />
                            </Field>
                            <Field label="RFC">
                                <input defaultValue={config.rfc} onBlur={e => set('rfc', e.target.value.toUpperCase().trim())} maxLength={13} className={inputCls + ' uppercase'} />
                            </Field>
                            <Field label="Tasa de IVA por defecto" hint="Se aplica a productos sin tasa propia. Cambia productos individuales en Inventario.">
                                <select value={String(config.ivaDefault)} onChange={e => set('ivaDefault', parseFloat(e.target.value))} className={inputCls}>
                                    <option value="0.16">16% (general)</option>
                                    <option value="0.08">8% (región fronteriza con estímulo)</option>
                                    <option value="0">0%</option>
                                </select>
                            </Field>
                            <Field label="Periodicidad de factura global">
                                <select value={config.periodicidadGlobal} onChange={e => set('periodicidadGlobal', e.target.value)} className={inputCls}>
                                    <option value="diaria">Diaria</option>
                                    <option value="semanal">Semanal</option>
                                    <option value="mensual">Mensual</option>
                                    <option value="bimestral">Bimestral (solo RESICO PF)</option>
                                </select>
                            </Field>
                            <Field label="Vencimiento de tu e.firma">
                                <input type="date" value={config.efirmaVence} onChange={e => set('efirmaVence', e.target.value)} className={inputCls} />
                            </Field>
                        </div>
                    </Card>

                    <div className="flex flex-col gap-5">
                        <Card>
                            <h3 className="text-lg font-bold text-zinc-950 tracking-tight mb-1">Nota de compra por WhatsApp</h3>
                            <p className="text-xs text-zinc-400 mb-4">Así aparece el encabezado y el cierre del mensaje que recibe el cliente.</p>
                            <div className="flex flex-col gap-4">
                                <Field label="Nombre de la papelería">
                                    <input defaultValue={config.nombreNegocio} placeholder="Papelería" onBlur={e => set('nombreNegocio', e.target.value)} className={inputCls} />
                                </Field>
                                <Field label="Dirección o teléfono (opcional)">
                                    <input defaultValue={config.direccionNegocio} placeholder="Ej. Av. Juárez 120, Centro · 55 1234 5678" onBlur={e => set('direccionNegocio', e.target.value)} className={inputCls} />
                                </Field>
                                <Field label="Mensaje final (opcional)" hint="Si lo dejas vacío: ¡Gracias por su compra!">
                                    <input defaultValue={config.mensajeNota} placeholder="Ej. Horario: L-S 9 a 20 h. ¡Gracias por su compra!" onBlur={e => set('mensajeNota', e.target.value)} className={inputCls} />
                                </Field>
                            </div>
                        </Card>
                        <Card>
                            <h3 className="text-lg font-bold text-zinc-950 tracking-tight mb-1">Respaldo</h3>
                            <p className="text-xs text-zinc-400 mb-4 leading-relaxed">
                                Ventas, gastos, régimen y checklist se guardan en tu Google Sheet (pestañas Fiscal_Ventas, Fiscal_Gastos y Fiscal_Config), así que el celular y la computadora ven lo mismo. Si no hay internet, se guardan en este dispositivo y se envían al sincronizar. El respaldo es una copia extra.
                            </p>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={exportar} className="py-3 rounded-2xl text-sm font-semibold bg-zinc-950 text-white hover:bg-zinc-800 flex items-center justify-center gap-2"><i className="ph ph-download-simple"></i>Exportar</button>
                                <button onClick={() => fileRef.current.click()} className="py-3 rounded-2xl text-sm font-semibold bg-white border border-zinc-200 text-zinc-700 hover:bg-zinc-50 flex items-center justify-center gap-2"><i className="ph ph-upload-simple"></i>Restaurar</button>
                                <input ref={fileRef} type="file" accept="application/json" onChange={importar} className="hidden" />
                            </div>
                            <div className="mt-4 text-xs text-zinc-400">{ventas.length} ventas · {gastos.length} gastos registrados</div>
                        </Card>
                        <Card>
                            <h3 className="text-lg font-bold text-zinc-950 tracking-tight mb-2">Cómo se calcula</h3>
                            <ul className="text-xs text-zinc-500 leading-relaxed list-disc pl-4 space-y-1.5">
                                <li>Los precios de venta se consideran con IVA incluido: IVA = precio − precio ÷ (1 + tasa).</li>
                                <li>RESICO (626): ISR mensual de 1% a 2.5% sobre ingresos cobrados sin IVA, sin deducciones.</li>
                                <li>Régimen 612: ISR sobre utilidad acumulada del año con la tarifa del art. 106 LISR, menos los pagos estimados de meses anteriores.</li>
                                <li>IVA acreditable solo de gastos con CFDI a tu RFC.</li>
                                <li>Solo cuentan las ventas registradas con esta versión de la app (año actual y anterior).</li>
                            </ul>
                        </Card>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
